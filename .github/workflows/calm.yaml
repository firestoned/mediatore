#
# Architecture-as-code gate (ADD step 2): the CALM model must validate against
# the FINOS meta-schema, and the committed Mermaid diagrams must match what the
# model renders — a diagram that lags the model is a missed ADD step, caught
# here instead of in review.

name: CALM

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/architecture/**'
      - 'Makefile'
      - '.github/workflows/calm.yaml'
  push:
    branches:
      - main
    paths:
      - 'docs/architecture/**'
      - 'Makefile'
      - '.github/workflows/calm.yaml'
  workflow_call:
  workflow_dispatch:

# A newer run of the same event on the same ref cancels the older one (a second push to
# the PR, the next merge to main). Across events, a merge to main cancels the PR runs and
# a release cancels main's: the preempt job in build.yaml (scripts/ci-preempt.sh).
# `github.workflow` is in the group because docs.yaml calls this workflow too: a called run
# evaluates this block in the caller's context, so without it the Docs run and the standalone
# CALM run of one pull request shared a group and the later cancelled the earlier (seen on
# PR #136, 2026-11-18).
concurrency:
  group: calm-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  validate:
    name: 🏛️ Validate + diagram drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Validate architecture against the meta-schema
        run: make calm-validate

      - name: Render diagrams
        run: make calm-diagrams

      - name: Fail on diagram drift
        run: git diff --exit-code docs/architecture/diagrams
