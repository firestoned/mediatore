# OpenSSF Scorecard supply-chain analysis; same configuration as banlieue's.
# Third-party actions, governed by their own terms.

name: Scorecard supply-chain security
on:
  # For the Branch-Protection check; default branch only.
  branch_protection_rule:
  # Keeps the Maintained check fresh.
  schedule:
    - cron: '41 10 * * 3'
  push:
    branches: [ "main" ]

# Top-level GITHUB_TOKEN is read-only; the job declares what Scorecard needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write
      # Publish results for the badge.
      id-token: write
      # SARIF fingerprinting + Actions-metadata checks.
      actions: read
      # Checkout, and the repository metadata the checks read.
      contents: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
