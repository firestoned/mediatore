#
# CodeQL analysis — explicit language list (same rationale as banlieue's):
#   - `rust`    — crates/**/*.rs
#   - `actions` — .github/workflows/**/*.yaml

name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly full re-scan on Sundays at 07:23 UTC (offset minute, no cron-queue
    # collision), keeping the dashboard fresh through quiet weeks.
    - cron: '23 7 * * 0'

# A newer run of the same event on the same ref cancels the older one (a second push to
# the PR, the next merge to main). Across events, a merge to main cancels the merged PR's runs and
# a release cancels main's: the preempt job in build.yaml (scripts/ci-preempt.sh).
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  analyze:
    name: 🔍 CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
      # Required by github/codeql-action to fetch workflow-run metadata for
      # SARIF fingerprinting.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
