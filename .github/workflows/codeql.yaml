#
# CodeQL analysis — explicit language list (same rationale as banlieue's):
#   - `rust`    — crates/**/*.rs
#   - `actions` — .github/workflows/**/*.yaml

name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly full re-scan on Sundays at 07:23 UTC (offset minute, no cron-queue
    # collision), keeping the dashboard fresh through quiet weeks.
    - cron: '23 7 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: 🔍 CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
      # Required by github/codeql-action to fetch workflow-run metadata for
      # SARIF fingerprinting.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
