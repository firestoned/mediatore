# SPDX-License-Identifier: Apache-2.0
#
# Build gate: license headers, signed commits, fmt, clippy, tests, cargo-audit,
# cargo-deny, the one static binary with CycloneDX SBOMs, the server container
# image and the two VM images, sandbox and gateway (SBOM'd, Cosign-signed and
# provenance-attested on push/release). A pull request builds and checks the three
# images in jobs that hold contents: read and never log in to a registry.
#
# Mirrors banlieue's build.yaml at mediatore's scale. Deliberately not ported yet:
# the grype/VEX triage loop and the SLSA generator (they depend on banlieue-vex
# tooling); revisit at the first release. All logic lives in Makefile targets
# (.claude/rules/github-workflows.md); jobs only install tools and call make.
#
# NOTE: no `paths:` filter — a required check that never triggers blocks the PR
# forever (banlieue roadmap 16 #1). This repo is small enough to always build.

name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published
  # Reusable: a release pipeline can call the whole gate.
  workflow_call:

# A newer run of the same event on the same ref cancels the older one (a second push to
# the PR, the next merge to main); a release is never cancelled. Across events, a merge
# to main cancels the merged PR's runs and a release cancels main's: the preempt job below.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

# Top-level GITHUB_TOKEN is read-only (OpenSSF Scorecard Token-Permissions).
# Jobs that push images, sign or attest declare elevated scopes themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A runner builds once: incremental state only slows the build and bloats the cache.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Preempt: a merge to main cancels the merged PR's runs still going, a release cancels
  # main's, so a hot fix is not queued behind work it supersedes. Nothing waits
  # on this job; it only frees runners (scripts/ci-preempt.sh).
  # ───────────────────────────────────────────────────────────────────────────
  preempt:
    name: ⏭️ Cancel superseded runs
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # cancel the superseded runs
      pull-requests: read # which PR the pushed commit merged
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cancel superseded runs
        run: make ci-preempt CI_PREEMPT_EVENT=${{ github.event_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ───────────────────────────────────────────────────────────────────────────
  # License headers — every file type, every PR.
  # ───────────────────────────────────────────────────────────────────────────
  license-check:
    name: ⚖️ Verify SPDX License Headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check license headers
        uses: firestoned/github-actions/security/license-check@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          copyright-holder: "Erick Bourgeois, mediatore"
          license-id: "Apache-2.0"

  # ───────────────────────────────────────────────────────────────────────────
  # Commit signatures — verify-mode differs by event type.
  # ───────────────────────────────────────────────────────────────────────────
  verify-commits:
    name: 🔐 Verify Signed Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify commits (PR)
        if: github.event_name == 'pull_request'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: origin/${{ github.base_ref }}
          verify-mode: pr

      - name: Verify commits (push to main)
        if: github.event_name == 'push'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-mode: push

      - name: Verify commits (release)
        if: github.event_name == 'release'
        uses: firestoned/github-actions/security/verify-signed-commits@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-mode: release

  # ───────────────────────────────────────────────────────────────────────────
  # Formatting + clippy.
  # ───────────────────────────────────────────────────────────────────────────
  format:
    name: 🎨 Check Formatting
    runs-on: ubuntu-latest
    needs: [license-check, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)
        with:
          components: rustfmt

      - name: Check formatting
        run: make fmt-check

  clippy:
    name: 📎 Clippy
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Run clippy
        run: make lint

  # ───────────────────────────────────────────────────────────────────────────
  # Tests — the whole workspace, dev-mode e2e included.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [license-check, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Run tests
        run: make test

  # ───────────────────────────────────────────────────────────────────────────
  # Security scans — cargo-audit + cargo-deny.
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: 🛡️ Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)

      - name: Run security scan
        uses: firestoned/github-actions/rust/security-scan@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          cargo-audit-version: "0.22.0"

  cargo-deny:
    name: 🧪 cargo-deny (License + Advisory + Sources)
    runs-on: ubuntu-latest
    needs: [verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          log-level: warn
          command: check

  # ───────────────────────────────────────────────────────────────────────────
  # The one static musl binary (ADR-0014): what banlieue-imagebuilder bakes into
  # the VM image and what the server image carries.
  # ───────────────────────────────────────────────────────────────────────────
  dist:
    name: 🦀 Static Binary (musl)
    runs-on: ubuntu-latest
    # Beside test, not behind it: nothing here is published. The image jobs, which copy
    # this binary and push, wait on test and clippy themselves.
    needs: [license-check, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The binary reports the release's version; fails if Cargo.toml then disagrees.
      - name: Set the workspace version (release)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make set-version VERSION="${TAG#v}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Build the binary
        run: make dist

      - name: Release assets, dry run (the release-only logic, proven on every event)
        run: make release-assets-test

      - name: Release version stamp works (the release-only step, proven on every event)
        run: make set-version-test

      - name: Generate CycloneDX SBOM
        run: make sbom

      - name: Stage SBOMs next to the binary
        run: |
          find . -name "*.cdx.json" -not -path './target/*' -not -path './dist/*' -exec mv {} dist/ \; || true

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mediatore-linux-amd64-musl
          path: |
            dist/mediatore
            dist/*.cdx.json
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # The CLI for a Mac: the same binary, built natively on an arm64 macOS runner
  # (no cross-compile) and attached to every release. Ad-hoc signed by the linker,
  # not notarized: `gh release download` sets no quarantine, a browser does.
  # ───────────────────────────────────────────────────────────────────────────
  dist-darwin:
    name: 🍎 CLI (darwin/arm64)
    runs-on: macos-15
    # Beside test, as dist: release-assets, the one consumer, waits on the image jobs
    # and so on test and clippy.
    needs: [license-check, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The binary reports the release's version; fails if Cargo.toml then disagrees.
      - name: Set the workspace version (release)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make set-version VERSION="${TAG#v}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref: re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Build the binary
        run: make dist-darwin

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mediatore-darwin-arm64
          path: dist/mediatore-darwin-arm64
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Server image: assembled on every event from the dist job's binary, pushed + signed
  # + SBOM'd on non-PR.
  # linux/amd64 only for now: arm64 follows banlieue's staged-binary pattern
  # once there is a release to justify it.
  # Two jobs, since a job's permissions cannot depend on the event: docker-check on a
  # pull request (contents: read, no login), docker on every other event (the write
  # scopes). The same split for the two VM images below.
  # ───────────────────────────────────────────────────────────────────────────
  docker-check:
    name: 🐳 Server Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, clippy, dist]
    # A pull request builds and checks and nothing else: no registry login, no write
    # scope, no OIDC token. An action version a pull request proposes runs here with a
    # read-only token (the publish job below is skipped on this event).
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The dist job's binary (BINARY_FROM=host), as the publish job takes it.
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mediatore-linux-amd64-musl
          path: dist

      - name: Restore the executable bit (artifacts drop it)
        run: make dist-chmod

      # Buildx alone, at the commit firestoned/github-actions' docker/setup-docker pins:
      # that composite always logs in to GHCR, and a pull request must not. Back to the
      # composite once it can skip the login.
      - name: Set up Docker Buildx (no registry login)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr

      - name: Build (never pushed)
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BINARY_FROM=host
          # Read only: main alone writes the cache.
          cache-from: type=gha
          sbom: true
          provenance: true

  docker:
    name: 🐳 Server Image (publish)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, clippy, dist]
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # keyless Cosign
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image carries the dist job's binary (BINARY_FROM=host): one compile per run,
      # the same file the release attaches, the release's version stamped in by that job.
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mediatore-linux-amd64-musl
          path: dist

      - name: Restore the executable bit (artifacts drop it)
        run: make dist-chmod

      - name: Set up Docker (login + buildx)
        uses: firestoned/github-actions/docker/setup-docker@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            # The merge build already tagged this commit's image sha-<commit>; a release
            # of the same commit built a different image (the version stamped in) and
            # overwrote that tag, which GHCR refused on 2026-11-09 (write_package). A
            # release's images carry the version alone, never a tag another build owns.
            type=sha,prefix=sha-,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BINARY_FROM=host
          cache-from: type=gha
          # Written by main alone: a PR reads main's cache and spends none of the quota.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
          sbom: true
          provenance: true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Cosign sign (keyless, by digest)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.docker_build.outputs.digest }}"

      - name: Generate image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.docker_build.outputs.digest }}
          format: cyclonedx-json
          output-file: docker-sbom.json
          upload-release-assets: false

      - name: Upload image SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-sbom
          path: docker-sbom.json
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # VM base image (ADR-0067): Kairos, Debian 13 and the OS layer the two VM images
  # share. Pushed + signed on non-PR; the two publish jobs below build FROM it by the
  # digest this job outputs. A pull request builds it inside each -check job instead.
  # ───────────────────────────────────────────────────────────────────────────
  vm-base-image:
    name: 🧱 VM Base Image (publish)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, clippy]
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # keyless Cosign
    outputs:
      digest: ${{ steps.base_build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker (login + buildx)
        uses: firestoned/github-actions/docker/setup-docker@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: base_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-vm-base
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: base_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=gha,scope=vm-base
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=vm-base' || '' }}
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Cosign sign (keyless, by digest)
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-vm-base@${{ steps.base_build.outputs.digest }}"

  # ───────────────────────────────────────────────────────────────────────────
  # Sandbox VM image (ADR-0023): the Kairos derivative every pool member boots.
  # Built and checked on a pull request (the -check job), pushed + signed + SBOM'd on
  # non-PR (the publish job).
  # ───────────────────────────────────────────────────────────────────────────
  guest-image-check:
    name: 🖥️ Sandbox VM Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, clippy, dist]
    # A pull request builds and checks and nothing else: no registry login, no write
    # scope, no OIDC token. An action version a pull request proposes runs here with a
    # read-only token (the publish job below is skipped on this event).
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The dist job's binary (BINARY_FROM=host), as the publish job takes it.
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mediatore-linux-amd64-musl
          path: dist

      - name: Restore the executable bit (artifacts drop it)
        run: make dist-chmod

      # The runner's own Docker, no buildx builder and no registry login: the overlay is
      # FROM the VM base this job builds first (ADR-0067), a local tag a docker-container
      # builder could not see. Built from the Makefile, as on the build host; never pushed.
      - name: Build the VM base and the sandbox overlay (never pushed)
        run: make guest-image BINARY_FROM=host

      - name: Check the image (what ADR-0023 promises, no listener)
        run: make guest-image-check

  guest-image:
    name: 🖥️ Sandbox VM Image (publish)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, clippy, dist, vm-base-image]
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # keyless Cosign
    outputs:
      digest: ${{ steps.guest_build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image carries the dist job's binary (BINARY_FROM=host): one compile per run,
      # the same file the release attaches, the release's version stamped in by that job.
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mediatore-linux-amd64-musl
          path: dist

      - name: Restore the executable bit (artifacts drop it)
        run: make dist-chmod

      - name: Set up Docker (login + buildx)
        uses: firestoned/github-actions/docker/setup-docker@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: guest_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-guest
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            # The merge build already tagged this commit's image sha-<commit>; a release
            # of the same commit built a different image (the version stamped in) and
            # overwrote that tag, which GHCR refused on 2026-11-09 (write_package). A
            # release's images carry the version alone, never a tag another build owns.
            type=sha,prefix=sha-,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build (and push on non-PR)
        id: guest_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.guest_meta.outputs.tags }}
          labels: ${{ steps.guest_meta.outputs.labels }}
          # The overlay FROM the base vm-base-image pushed in this run, by digest (ADR-0067).
          build-args: |
            BINARY_FROM=host
            VM_BASE=ghcr.io/${{ github.repository }}-vm-base@${{ needs.vm-base-image.outputs.digest }}
          cache-from: type=gha,scope=guest
          # Written by main alone: a PR reads main's cache and spends none of the quota.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=guest' || '' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Cosign sign (keyless, by digest)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-guest@${{ steps.guest_build.outputs.digest }}"

      - name: Generate image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}-guest@${{ steps.guest_build.outputs.digest }}
          format: cyclonedx-json
          output-file: guest-image-sbom.json
          upload-release-assets: false

      - name: Upload image SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-image-sbom
          path: guest-image-sbom.json
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Egress gateway VM image (ADR-0028 decision 10): the Kairos derivative with Envoy
  # that the three proxy VMs boot.
  # Built and checked on a pull request (the -check job), pushed + signed + SBOM'd on
  # non-PR (the publish job).
  # ───────────────────────────────────────────────────────────────────────────
  gateway-image-check:
    name: 🚪 Gateway VM Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, clippy, dist]
    # A pull request builds and checks and nothing else: no registry login, no write
    # scope, no OIDC token. An action version a pull request proposes runs here with a
    # read-only token (the publish job below is skipped on this event).
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The dist job's binary (BINARY_FROM=host), as the publish job takes it.
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mediatore-linux-amd64-musl
          path: dist

      - name: Restore the executable bit (artifacts drop it)
        run: make dist-chmod

      # The runner's own Docker, no buildx builder and no registry login: the overlay is
      # FROM the VM base this job builds first (ADR-0067), a local tag a docker-container
      # builder could not see. Built from the Makefile, as on the build host; never pushed.
      - name: Build the VM base and the gateway overlay (never pushed)
        run: make gateway-image BINARY_FROM=host

      - name: Check the image (ADR-0028 decision 8 and ADR-0027, and the kind bootstrap against the image's template)
        run: make gateway-image-check

  gateway-image:
    name: 🚪 Gateway VM Image (publish)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, clippy, dist, vm-base-image]
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # keyless Cosign
    outputs:
      digest: ${{ steps.gateway_build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image carries the dist job's binary (BINARY_FROM=host): one compile per run,
      # the same file the release attaches, the release's version stamped in by that job.
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mediatore-linux-amd64-musl
          path: dist

      - name: Restore the executable bit (artifacts drop it)
        run: make dist-chmod

      - name: Set up Docker (login + buildx)
        uses: firestoned/github-actions/docker/setup-docker@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: gateway_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-gateway
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            # The merge build already tagged this commit's image sha-<commit>; a release
            # of the same commit built a different image (the version stamped in) and
            # overwrote that tag, which GHCR refused on 2026-11-09 (write_package). A
            # release's images carry the version alone, never a tag another build owns.
            type=sha,prefix=sha-,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build (and push on non-PR)
        id: gateway_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image/gateway/Dockerfile
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.gateway_meta.outputs.tags }}
          labels: ${{ steps.gateway_meta.outputs.labels }}
          # The overlay FROM the base vm-base-image pushed in this run, by digest (ADR-0067).
          build-args: |
            BINARY_FROM=host
            VM_BASE=ghcr.io/${{ github.repository }}-vm-base@${{ needs.vm-base-image.outputs.digest }}
          cache-from: type=gha,scope=gateway
          # Written by main alone: a PR reads main's cache and spends none of the quota.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=gateway' || '' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Cosign sign (keyless, by digest)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-gateway@${{ steps.gateway_build.outputs.digest }}"

      - name: Generate image SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}-gateway@${{ steps.gateway_build.outputs.digest }}
          format: cyclonedx-json
          output-file: gateway-image-sbom.json
          upload-release-assets: false

      - name: Upload image SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-image-sbom
          path: gateway-image-sbom.json
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Attest: GitHub build-provenance attestation for the pushed images.
  # ───────────────────────────────────────────────────────────────────────────
  attest:
    name: 🔏 Attest Image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [docker, vm-base-image, guest-image, gateway-image]
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance (server image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (VM base image, ADR-0067)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-vm-base
          subject-digest: ${{ needs.vm-base-image.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (sandbox VM image, ADR-0023)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-guest
          subject-digest: ${{ needs.guest-image.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (gateway VM image, ADR-0028)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-gateway
          subject-digest: ${{ needs.gateway-image.outputs.digest }}
          push-to-registry: true

  # ───────────────────────────────────────────────────────────────────────────
  # Release assets: what the release page carries beside the two images, gathered
  # by `make release-assets` and attested file by file (`gh attestation verify
  # <file> --repo firestoned/mediatore`).
  # ───────────────────────────────────────────────────────────────────────────
  release-assets:
    name: 🚀 Release Assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [dist, dist-darwin, docker, guest-image, gateway-image, attest]
    permissions:
      contents: write # upload the assets to the release
      id-token: write # keyless attestation of the files
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the binaries and the image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts

      - name: Stage them where make release-assets looks
        run: mkdir -p dist && cp artifacts/mediatore-linux-amd64-musl/* artifacts/mediatore-darwin-arm64/* artifacts/docker-sbom/* artifacts/guest-image-sbom/* artifacts/gateway-image-sbom/* dist/ && chmod +x dist/mediatore dist/mediatore-darwin-arm64

      - name: Gather the assets
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: make release-assets VERSION="${TAG#v}" IMAGE_DIGEST=${{ needs.docker.outputs.digest }} GUEST_DIGEST=${{ needs.guest-image.outputs.digest }} GATEWAY_DIGEST=${{ needs.gateway-image.outputs.digest }} RELEASE_DIR=release

      - name: Attest build provenance (every asset)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Upload release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
