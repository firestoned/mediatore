#
# Dependabot auto-merge, following banlieue's design:
#   - the e2e gate (reusable e2e.yaml) must pass before anything merges;
#   - patch / minor -> enable auto-merge (squash);
#   - major -> leave OPEN and comment for manual review; an approval by the
#     owner, a member or a collaborator re-triggers this workflow and counts
#     as the sign-off (anyone with a GitHub account can submit an approving
#     review on a public repository, so the reviewer's association is checked);
#   - any failure leaves the PR untouched. Fail-safe: this workflow can only
#     ever ENABLE a merge on an explicit green run.
#
# Prerequisite (repo settings): Settings > General > "Allow auto-merge".

name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# A newer push to the PR cancels the older run of the same PR. Review events
# run in a group of their own, keyed by the review's state, and never cancel:
# a comment or a drive-by review must not be able to stop an in-flight gate.
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}-${{ github.event_name }}-${{ github.event.review.state || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: Fetch Dependabot metadata
    # Gate on the PR author (stable for the PR's life), not github.actor.
    # On review events, only an approval is a merge signal, and only from an
    # author GitHub associates with this repository.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && (github.event_name != 'pull_request_review'
          || (github.event.review.state == 'approved'
              && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                          github.event.review.author_association)))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      update-type: ${{ steps.meta.outputs.update-type }}
      auto-merge: ${{ steps.classify.outputs.auto-merge }}
    steps:
      - name: Fetch metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The single place that decides "may this merge itself?":
      # patch/minor yes; an approval by the owner, a member or a collaborator
      # yes (it IS the manual review a held major was waiting for); everything
      # else holds. Event fields reach the script through env, never inline.
      - name: Classify
        id: classify
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          EVENT: ${{ github.event_name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_ASSOCIATION: ${{ github.event.review.author_association }}
        run: |
          allow=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) allow=true ;;
          esac
          if [ "$EVENT" = "pull_request_review" ] && [ "$REVIEW_STATE" = "approved" ]; then
            case "$REVIEW_ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) allow=true ;;
            esac
          fi
          echo "auto-merge=$allow" >> "$GITHUB_OUTPUT"

  # The gate: the full dev-mode loop must pass before anything self-merges.
  gate:
    name: E2E gate
    needs: [metadata]
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read

  auto-merge:
    name: Enable auto-merge
    needs: [metadata, gate]
    if: needs.metadata.outputs.auto-merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  hold-major:
    name: Hold major for review
    needs: [metadata, gate]
    if: needs.metadata.outputs.auto-merge != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ needs.metadata.outputs.update-type }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Held for manual review (update-type: \`$UPDATE_TYPE\`). The e2e gate passed; an approval by the owner, a member or a collaborator will enable auto-merge."
