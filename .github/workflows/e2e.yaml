#
# End-to-end verification of the dev-mode loop with real binaries over real
# HTTP listeners: fake IdP login -> POST /v1/claims -> bind to a registered
# node -> GET /v1/me (mediatore guest) -> POST /v1/token (mediatore token) ->
# STS JWT verified against mediatore's own JWKS -> release -> cut-off.
#
# What this proves beyond `cargo test`: the roles of the one binary agree on the
# wire contract when started as separate processes (ADR-0014), config files parse, ports
# bind, and the demo a human runs (`make e2e`) is the same thing CI runs.
#
# The kind jobs run the live tiers against a real SPIRE (server, controller
# manager, agent, CSI driver and the TPM attestor component, from the manifests
# rendered once into dev/kind/spire) in a kind cluster: the entries
# round trip as the broker's own ServiceAccount, then the broker image on the CSI
# socket with agent-issued client SVIDs over SPIFFE mTLS, then the claim watcher
# against banlieue's CRDs (lease, node-entry trigger), then the AgentSandbox CRD, its
# subject policy and reconciler from request to Ready and back, then notaio from its
# release signing with OpenBao and the broker comparing sandboxes with its bundle in
# shadow: `make kind-e2e-ci`.
#
# The live tiers are one build and three shards. `kind-build` compiles the musl binary and
# the testkit's binaries once (`make dist dist-e2e`) and hands dist/ on as an artifact;
# each `kind-live` shard brings up its own cluster from that dist/ (`KIND_PREBUILT=1`) and
# runs its suites, so the two gateway tiers no longer wait behind the rest. The union of
# the shards' suites is `make kind-e2e`, in its order: a suite added to that aggregate is
# added to a shard here.
#
# Not here: the TPM attestation path (ADR-0018, `make kind-e2e-tpm`) needs a vTPM
# behind the kind node, which is swtpm through the kernel's tpm_vtpm_proxy module. The
# Azure kernels of GitHub-hosted runners do not ship that module (checked against
# linux-modules-extra-6.17.0-1022-azure on 2026-10-24), so that tier runs by hand on a
# host whose kernel has it. docs/guides/testing.md has the tiers and what each proves.

name: E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Reusable: callable from a release pipeline or dependabot-auto-merge.
  workflow_call:
    inputs:
      # Never passed: its default is what tells a called run (true) from this workflow's
      # own pull_request run (unset), which the jobs' `if:` needs for Dependabot's PRs.
      called:
        description: "Leave the default: marks the run as a workflow_call invocation"
        type: boolean
        default: true
  workflow_dispatch:

# A newer run of the same event on the same ref cancels the older one (a second push to
# the PR, the next merge to main). Across events, a merge to main cancels the merged PR's runs and
# a release cancels main's: the preempt job in build.yaml (scripts/ci-preempt.sh).
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A runner builds once: incremental state only slows the build and bloats the cache.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  # Dependabot's PRs get this workflow once, as dependabot-auto-merge's gate (a
  # workflow_call, `inputs.called`); the pull_request run of the same PR skips every job
  # rather than run the tiers a second time. Every other event and author runs them.
  dev-loop:
    name: 🧪 Dev-mode loop (front to back)
    if: ${{ inputs.called || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      # jq ships on ubuntu-latest runners; the target fails loudly if missing.
      - name: Run the front-to-back loop
        run: make e2e

  # The one compile of the live tiers: dist/mediatore and the testkit's binaries (the e2e
  # image's two and the fixture helpers), musl, release.
  kind-build:
    name: 🦀 Binaries for the live suites
    if: ${{ inputs.called || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # musl: the images are the shipped Dockerfile's runtime stage over host-built
      # static binaries (`make dist`), so the cargo cache does the heavy lifting.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref: re-pin quarterly)
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0

      - name: Build the binaries
        run: make dist dist-e2e

      # Read by the shards of this run only: a day is plenty.
      - name: Upload dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  kind-live:
    name: 🧪 Live suites against SPIRE in kind (${{ matrix.shard }})
    if: ${{ inputs.called || github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs: [kind-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # cargo: the entries suite is a cargo test (`make live-admission-test`), so this
          # shard keeps a toolchain and its cache; the gateway shards compile nothing.
          - shard: core
            suites: kind-e2e-entries kind-e2e-mtls kind-e2e-watcher kind-e2e-sandbox kind-e2e-dex kind-e2e-policy
            cargo: true
          - shard: gateway
            suites: kind-e2e-gateway
            cargo: false
          - shard: gateway-policy
            suites: kind-e2e-gateway-policy
            cargo: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        if: matrix.cargo
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref: re-pin quarterly)

      # Its own entry: one test's debug build, not the musl release build the job of
      # this name cached before the tiers were split.
      - name: Cache cargo dependencies
        if: matrix.cargo
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          key: live-kube

      - name: Download dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kind-dist
          path: dist

      - name: Restore the executable bits (artifacts drop them)
        run: make dist-chmod KIND_PREBUILT=1

      # Docker and kubectl ship on ubuntu-latest (no Helm: SPIRE is applied from rendered
      # manifests); `make kind-install` fetches the pinned kind CLI (checksum verified).
      # The target tears the cluster down after,
      # and dumps entries, policy, broker and client pods and controller-manager logs
      # on failure.
      - name: Live suites as the broker ServiceAccount
        run: make kind-e2e-ci KIND_E2E_SUITES="${{ matrix.suites }}" KIND_PREBUILT=1
