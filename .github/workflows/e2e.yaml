#
# End-to-end verification of the dev-mode loop with real binaries over real
# HTTP listeners: fake IdP login -> POST /v1/claims -> bind to a registered
# node -> GET /v1/me (mediatore guest) -> POST /v1/token (mediatore token) ->
# STS JWT verified against mediatore's own JWKS -> release -> cut-off.
#
# What this proves beyond `cargo test`: the roles of the one binary agree on the
# wire contract when started as separate processes (ADR-0014), config files parse, ports
# bind, and the demo a human runs (`make e2e`) is the same thing CI runs.
#
# The second job runs the live tiers against a real SPIRE (server, controller
# manager, agent, CSI driver from the hardened charts) in a kind cluster: the entries
# round trip as the broker's own ServiceAccount, then the broker image on the CSI
# socket with agent-issued client SVIDs over SPIFFE mTLS, then the claim watcher
# against banlieue's CRDs (lease, node-entry trigger), then the AgentSandbox CRD, its
# subject policy and reconciler from request to Ready and back: `make kind-e2e-ci`.
# docs/guides/testing.md has the tiers and what each proves.

name: E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Reusable: callable from a release pipeline or dependabot-auto-merge.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dev-loop:
    name: 🧪 Dev-mode loop (front to back)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@787be16a6bed7e6c2297683bb75bc9b5f1a54397 # v1.3.8

      # jq ships on ubuntu-latest runners; the target fails loudly if missing.
      - name: Run the front-to-back loop
        run: make e2e

  kind-live:
    name: 🧪 Live suites against SPIRE in kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # musl: the images are the shipped Dockerfile's runtime stage over host-built
      # static binaries (`make dist`), so the cargo cache does the heavy lifting.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@787be16a6bed7e6c2297683bb75bc9b5f1a54397 # v1.3.8

      # Docker, kubectl and helm ship on ubuntu-latest; `make kind-install` fetches the
      # pinned kind CLI (checksum verified). The target tears the cluster down after,
      # and dumps entries, policy, broker and client pods and controller-manager logs
      # on failure.
      - name: Live suites as the broker ServiceAccount
        run: make kind-e2e-ci
