#
# Dependency update automation (Scorecard Dependency-Update-Tool). Weekly, and
# every ecosystem carries a 7-day cooldown: Dependabot waits after a version is
# published before proposing it — the standard defence against a compromised
# release being auto-merged within hours of publication.

version: 2
updates:
  # GitHub Actions — keeps the SHA-pinned actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Rust crates.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # One PR for everything. Majors are included deliberately: cargo treats a
      # 0.x -> 0.y bump as major, so a minor/patch-only group leaves most of
      # this workspace's pre-1.0 crates as individual PRs.
      cargo:
        patterns: ["*"]

  # Container base images (Dockerfile FROM lines).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
