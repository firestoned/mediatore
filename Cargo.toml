[workspace]
resolver = "3"
members = [
  "crates/mediatore-proto",
  "crates/mediatore-api",
  "crates/mediatore-entra",
  "crates/mediatore-sts",
  "crates/mediatore-spire",
  "crates/mediatore-tls",
  "crates/mediatore-claims",
  "crates/mediatore-store",
  "crates/mediatore-openbao",
  "crates/mediatore",
  "crates/mediatore-guest",
  "crates/mediatore-client",
  "crates/mediatore-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/firestoned/mediatore"
homepage = "https://github.com/firestoned/mediatore"
authors = ["Erick Bourgeois"]
publish = false

[workspace.dependencies]
# in-repo crates
mediatore-proto  = { path = "crates/mediatore-proto" }
mediatore-api    = { path = "crates/mediatore-api" }
mediatore-entra  = { path = "crates/mediatore-entra" }
mediatore-sts    = { path = "crates/mediatore-sts" }
mediatore-spire  = { path = "crates/mediatore-spire" }
mediatore-tls    = { path = "crates/mediatore-tls" }
mediatore-claims = { path = "crates/mediatore-claims" }
mediatore-store  = { path = "crates/mediatore-store" }
mediatore-openbao = { path = "crates/mediatore-openbao" }
mediatore-guest  = { path = "crates/mediatore-guest" }
mediatore-client = { path = "crates/mediatore-client" }
mediatore-testkit = { path = "crates/mediatore-testkit" }

# banlieue CRD types (ADR-0002, ADR-0011), pinned by hash: banlieue main at the merge of
# PR #98 (banlieue-api on kube's derive feature only, so no `ring` enters this graph).
# Becomes a tag pin when banlieue cuts a release with VirtualMachineClaim. cargo deny
# allows this one git source.
banlieue-api = { git = "https://github.com/firestoned/banlieue", rev = "20666eb0cf1011673b4b319e33b96c1f57d8a8ab", package = "banlieue-api", default-features = false }

# async + web
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "fs", "time", "sync", "net", "io-util"] }
axum         = { version = "0.8", features = ["json", "http2"] }
tower        = "0.5"
tower-http   = { version = "0.7", features = ["trace", "timeout"] }
# TLS: every client and server is rustls on aws-lc-rs (ADR-0007). reqwest and kube are
# built without a provider so `ring` never enters the graph; cargo deny bans it.
# `prefer-post-quantum` puts X25519MLKEM768 first in every key share we offer; without
# it rustls lists the hybrid last. No `tls12` of our own: every config we build is 1.3.
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls       = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "prefer-post-quantum", "std"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging"] }
hyper        = { version = "1", features = ["server", "http1", "http2"] }
hyper-util   = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
arc-swap     = "1"
# AF_VSOCK for the guest's GuestReady report on Cloud Hypervisor (ADR-0019); `all` carries the vsock API
socket2      = { version = "0.6", features = ["all"] }
async-trait  = "0.1"
futures      = "0.3"

# serde + formats
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
# safe-Rust YAML; serde_yaml_ng pulled the unmaintained unsafe-libyaml (RUSTSEC-2024-0449)
serde-saphyr   = "1.3"

# identity + crypto
# aws_lc_rs backend: jsonwebtoken 10+ requires exactly one crypto provider, and
# aws-lc-rs is the one every TLS stack and the refresh envelope already run on
# (ADR-0007, ADR-0012). The RustCrypto backend carried a second P-256 stack on the
# unpatched crypto-bigint 0.5 line (RUSTSEC-2026-0387) and the `rsa` crate
# (RUSTSEC-2023-0071); neither is in the tree now.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
p256         = "0.14"
base64       = "0.23"
sha2         = "0.11"
hex          = "0.4"
# SPIFFE: Workload API client (X509Source, in memory, rotated by the agent), SPIFFE ID and
# SVID parsing. The TLS verifiers over that material are mediatore-tls (ADR-0007).
spiffe       = { version = "0.18", default-features = false, features = ["x509-source"] }
# EK certificate parsing: the SubjectPublicKeyInfo is what the tpm attestor hashes (ADR-0006)
x509-cert    = { version = "0.3", default-features = false, features = ["pem"] }
uuid         = { version = "1", features = ["v4", "serde"] }
# The refresh envelope's AES-256-GCM (ADR-0012): the provider rustls already runs on.
aws-lc-rs    = "1"
chrono       = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# store (ADR-0012): one query set over the Any driver on SQLite or PostgreSQL; rustls on
# aws-lc-rs for the PostgreSQL leg; no macros (the migrator is built from include_str!),
# no MySQL (its `rsa` path stays out).
sqlx        = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite-bundled", "postgres", "any", "migrate"] }

# kubernetes
kube        = { version = "4", default-features = false, features = ["client", "config", "derive", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
# The AgentSandbox CRD schema (ADR-0008) is derived from the Rust type.
schemars    = "1"

# errors, logging, cli
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap               = { version = "4", features = ["derive", "env"] }

# test-only (mock API server for the kube entry manager; test CA for SVIDs)
tower-test     = "0.4"
http           = "1"
http-body-util = "0.1"
rcgen          = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
time           = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
