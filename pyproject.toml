[tool.poetry]
name = "mediatore-docs"
version = "0.1.0"
description = "Documentation dependencies for mediatore - identity broker for banlieue sandbox VMs"
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"

# Core MkDocs - pin to 1.x to avoid breaking changes in 2.0
# See: https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
mkdocs = ">=1.6.0,<2.0"
mkdocs-material = "^9.5.0"

# MkDocs plugins
mkdocs-git-revision-date-localized-plugin = "^1.2.4"

# Markdown extensions
pymdown-extensions = ">=11.0.1,<13.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
