# Dev config: homelab shape (Dex + GitHub, STS backend), header-based peer identity.
trust_domain: sandbox.home.example
dev_mode: true
listen:
  user: 127.0.0.1:8080
  sandbox: 127.0.0.1:8443
issuers:
  - url: https://dex.home.example
    backend: sts
    client_id: mediatore
    subject_claim: preferred_username
    required_group: firestoned:sandbox-users
audiences:
  - name: grafana.home.example
    via: sts
    max_ttl: 900
sts:
  issuer: https://mediatore.home.example
  kid: dev-1
  signing_key_file: dev/sts.pem
# A workload's output, redacted in the VM and streamed to its owner (ADR-0045). Off by
# default: a claim with `workload.logs: true` is refused and the routes answer 501. On, the
# broker keeps the newest `max_bytes` per claim (default 1 MiB, ceiling 4 MiB) in Secrets
# owned by the sandbox, for `retention_secs` after the claim ends (default: store.retention_secs).
logs:
  enabled: false
