#
# SPIRE for the kind tiers (`make kind-spire`): the manifests `make kind-spire-render`
# produced from SPIRE's distribution (crds.yaml, spire.yaml; tracked, re-rendered on a
# version bump, never edited by hand), the TPM node attestor and the OpenBao upstream
# authority as the same kustomize components the homelab includes (ADR-0018, ADR-0031),
# and the server.conf the two components' fragments call for, generated by
# render-server-conf-patch.sh (the OpenBao address is the kind Service's). No Helm release, no
# hooks: the Makefile applies crds.yaml first, then this, then sets the controller
# manager's webhook to fail closed as the chart's post-install hook did.
# hardening-patch.yaml closes what the chart's recommended contexts leave open and no
# value reaches (the CSI node driver registrar's container); the CSI driver itself is
# privileged by necessity (bidirectional mount propagation), and the API server forbids
# allowPrivilegeEscalation=false on a privileged container.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crds.yaml
  - spire.yaml
components:
  - ../../../deploy/spire-tpm
  - ../../../deploy/spire-upstream
patches:
  - path: server-conf-patch.yaml
  - path: hardening-patch.yaml
