#
# SPIRE in kind, for `make kind-e2e`: the same hardened charts and versions as the
# measured homelab deployment (ADR-0005 appendix), shaped the same way (release `spire`
# in namespace `spire-server`, so the controller manager's className is
# `spire-server-spire`), minus what a throwaway cluster has no use for: a second
# replica, PostgreSQL, the OIDC discovery provider. The trust domain is the RFC 2606
# placeholder; real values never live in tracked files.
global:
  spire:
    clusterName: kind
    trustDomain: sandbox.test
    # The chart refuses to render without a CA subject country; placeholders only.
    caSubject:
      country: XX
      organization: mediatore test
      commonName: sandbox.test
    namespaces:
      # Created by the Makefile, so the release namespace and the server namespace
      # coincide exactly as they do in the homelab.
      create: false
      server:
        name: spire-server
      system:
        name: spire-system
    recommendations:
      enabled: true
spire-server:
  controllerManager:
    enabled: true
  # sqlite on the kind default StorageClass
  persistence:
    size: 1Gi
spiffe-oidc-discovery-provider:
  enabled: false
