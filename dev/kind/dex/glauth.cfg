#
# The LDAP directory behind the kind tier's Dex (ADR-0013): one user, octocat, in the
# group the broker gates on, and the service account Dex binds as. Group membership is
# what the tier changes to prove that a refresh at Dex re-reads it. Passwords are fixtures
# for a throwaway cluster (sha256 of "octocat-e2e" and "dex-e2e").
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=sandbox,dc=test"

[[users]]
  name = "octocat"
  uidnumber = 5001
  primarygroup = 5501
  otherGroups = [5502]
  passsha256 = "1c9cf1c7b18a3b9da73298c7aea9c802f2ca2870dbd5818401e46bdca0e9195b"
  mail = "octocat@sandbox.test"

[[users]]
  name = "dex"
  uidnumber = 5002
  primarygroup = 5503
  passsha256 = "ff0e50cb9a555b1f328b113943a1c0a1c5e0f6047564be48a7e8b28bf5138a9b"
  mail = "dex@sandbox.test"
  # Dex searches users and groups as this account (a TOML sub-table: it must be the
  # last thing in this user's block).
  [[users.capabilities]]
    action = "search"
    object = "*"

[[groups]]
  name = "users"
  gidnumber = 5501

[[groups]]
  name = "sandbox-users"
  gidnumber = 5502

[[groups]]
  name = "svcaccts"
  gidnumber = 5503
