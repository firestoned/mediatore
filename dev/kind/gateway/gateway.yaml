#
# The egress gateway in kind (`make kind-gateway`, ADR-0028): one pod standing in for a
# gateway VM, Envoy from its official image beside the authorizer, mediatore gateway, both
# with the gateway SVID from the real agent through the CSI volume (the ClusterSPIFFEID is a
# test fixture an admin creates; on a VM it is the platform team's ClusterStaticEntry,
# decision 2). Beside it, the destination the tier reaches through the gateway: the
# testkit's probe in its serve mode, answering with the host it was asked for, over TLS on
# the certificate `make kind-gateway` mints (Secret destination-tls, the fixture CA on the
# proxy's route as the audience's CA), since the egress proxy speaks HTTPS to every
# upstream (ADR-0025 decision 2). The claim-side pods, the real egress proxy with its
# forwarder and a workload driving it, are created by dev/kind/gateway-e2e.sh once the
# claim exists.
apiVersion: v1
kind: Namespace
metadata:
  name: mediatore-e2e-gateway
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: mediatore-e2e-gateway
spec:
  className: spire-server-spire
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/gateway"
  podSelector:
    matchLabels: { mediatore.dev/e2e-role: gateway }
  namespaceSelector:
    matchLabels: { kubernetes.io/metadata.name: mediatore-e2e-gateway }
  ttl: 1h
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: mediatore-e2e-gateway
spec:
  selector: { mediatore.dev/e2e-role: gateway }
  ports:
    - { name: sandbox, port: 8443, targetPort: sandbox }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mediatore-e2e-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { mediatore.dev/e2e-role: gateway }
  template:
    metadata:
      labels: { mediatore.dev/e2e-role: gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.40.2
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - { name: sandbox, containerPort: 8443 }
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy, readOnly: true }
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true }
          securityContext:
            # The image's envoy user.
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
        - name: authorizer
          image: ghcr.io/firestoned/mediatore:kind
          imagePullPolicy: Never
          command:
            - /usr/bin/mediatore
            - gateway
            - --listen
            - 127.0.0.1:9001
            # Short bounds, so the tier sees the stale window and the outage within minutes;
            # the stale window long enough for a sandbox-shaped pod (the proxy waiting for
            # its SVID, then the workload) to start inside it on a slow runner.
            - --fresh-secs
            - "5"
            - --stale-secs
            - "120"
          env:
            - { name: MEDIATORE_URL, value: "https://mediatore-sandbox.banlieue-system.svc" }
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spire/sockets/spire-agent.sock" }
            - { name: RUST_LOG, value: "info" }
          volumeMounts:
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true }
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: envoy-config
          configMap: { name: envoy-config }
        - name: spire-agent-socket
          csi: { driver: csi.spiffe.io, readOnly: true }
---
apiVersion: v1
kind: Service
metadata:
  name: destination
  namespace: mediatore-e2e-gateway
spec:
  selector: { mediatore.dev/e2e-role: destination }
  ports:
    - { name: https, port: 8443, targetPort: https }
    # The same destination on a second port: a policy's direct egress entry in the gateway
    # policy tier (ADR-0030), refused under shadow, reached under enforce.
    - { name: direct, port: 8081, targetPort: direct }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: destination
  namespace: mediatore-e2e-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { mediatore.dev/e2e-role: destination }
  template:
    metadata:
      labels: { mediatore.dev/e2e-role: destination }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: destination
          image: localhost/mediatore-e2e:kind
          imagePullPolicy: Never
          command:
            - /usr/bin/gateway-probe
            - serve
            - --listen
            - 0.0.0.0:8443
            - --tls-cert
            - /etc/destination-tls/server.pem
            - --tls-key
            - /etc/destination-tls/server-key.pem
          ports:
            - { name: https, containerPort: 8443 }
          volumeMounts:
            - { name: tls, mountPath: /etc/destination-tls, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
        - name: direct
          image: localhost/mediatore-e2e:kind
          imagePullPolicy: Never
          command:
            - /usr/bin/gateway-probe
            - serve
            - --listen
            - 0.0.0.0:8081
            - --tls-cert
            - /etc/destination-tls/server.pem
            - --tls-key
            - /etc/destination-tls/server-key.pem
          ports:
            - { name: direct, containerPort: 8081 }
          volumeMounts:
            - { name: tls, mountPath: /etc/destination-tls, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tls
          secret: { secretName: destination-tls }
