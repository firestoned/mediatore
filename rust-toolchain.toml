# One compiler for every build, the release binary included: a floating channel would let
# the bytes of a signed artifact depend on the day it was built. Move it on purpose, with
# the gate green on the new version (rustup installs what this file names).
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-musl"]
