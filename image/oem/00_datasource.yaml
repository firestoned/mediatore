#
# The Kairos base's datasource stage (/system/oem/00_datasource.yaml of
# debian:13-core-amd64-generic-v3.7.2), with its providers cut to the ones that read a local
# device (ADR-0063 decision 8): banlieue hands a member its user data on a NoCloud seed disk
# (cdrom, config-drive) or through the hypervisor's guestinfo channel (vmware), never from a
# cloud's metadata address. The base probed twelve providers, several by HTTP to a link-local
# address, in the initramfs before any table can be loaded. The rest of the file is the
# base's, unchanged; a base bump re-copies it (image/check.sh compares the providers line).
name: "Datasource handling"
stages:
  rootfs.before:
    - &moveOldUserdata
      name: "Move old datasource to new location"
      if: '[ -d /oem/userdata ] && [ ! -d /oem/95_userdata ]' # If old userdata exists and new one does not
      commands:
      - mv -f /oem/userdata /oem/95_userdata
    - &removeOldUserdata
      name: "Remove old userdata"
      if: '[ -d /oem/userdata ] && [ -d /oem/95_userdata ]' # If both exist, remove the old one
      commands:
      - rm -rf /oem/userdata
    - &datasource
      if: '[ ! -e /oem/95_userdata ] && ([ ! -f /run/cos/uki_boot_mode ] || grep -q "kairos.pull_datasources" /proc/cmdline )'
      name: "Pull data from provider"
      datasource:
        providers: ["cdrom", "config-drive", "vmware"]
        path: "/oem/95_userdata"
    - if: '[ ! -e /oem/95_userdata ]'
      name: "Sentinel file for userdata"
      files:
      - path: /run/.userdata_load
  initramfs.before:
    - <<: *moveOldUserdata
    - <<: *removeOldUserdata
    - <<: *datasource
    - if: '[ ! -e /oem/95_userdata ]'
      files:
      - path: /run/.userdata_load
  # After network, if no datasource could be pulled, we stop trying
  network:
    - <<: *moveOldUserdata
    - <<: *removeOldUserdata
    - <<: *datasource
    - if: '[ -e /oem/95_userdata ] && [ -f /run/.userdata_load ]'
      name: "Run stages if userdata is found"
      commands:
      - kairos-agent run-stage initramfs --override-cloud-init-paths /oem/95_userdata
      - kairos-agent run-stage boot --override-cloud-init-paths /oem/95_userdata
      - rm -rf /run/.userdata_load
    - if: '[ ! -e /oem/95_userdata ] && [ -f /run/.userdata_load ]'
      name: "Remove userdata sentinel"
      commands:
      - rm -rf /run/.userdata_load
