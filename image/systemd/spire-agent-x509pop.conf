#
# Drop-in for a pool whose guests have no vTPM (banlieue's firecracker class, or a Cloud
# Hypervisor host opted in to its attestation CA; ADR-0049). The pool's cloud-config layer
# writes it to /etc/systemd/system/spire-agent.service.d/x509pop.conf beside the x509pop
# agent configuration (image/spire/agent-x509pop.conf). Not installed by the image: a pool
# with a vTPM keeps the TPM attestor and never starts the node-cert units.

[Unit]
Requires=mediatore-node-cert.service
After=mediatore-node-cert.service
Wants=mediatore-node-cert-renew.service

[Service]
# The agent's data directory on tmpfs (image/spire/agent-x509pop.conf): this member has no
# vTPM to seal a disk with, so nothing of the agent's identity is written to one. Made here,
# as the agent's user, under the unit's own runtime directory (/run/spire, which the base
# unit declares and preserves across restarts), before the agent starts.
ExecStartPre=/usr/bin/install -d -m 0700 /run/spire/agent
