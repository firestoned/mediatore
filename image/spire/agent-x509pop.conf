# The SPIRE agent on a pool VM with no vTPM (ADR-0049): the same as image/spire/agent.conf
# but for the node attestor, x509pop, over the key and certificate mediatore node-cert
# fetched from the host (image/systemd/mediatore-node-cert.service). The agent ID becomes
# spiffe://<td>/spire/agent/x509pop/<host CA CN>/<machine UID>, which the broker's node and
# claim entries name as their parent. Written by the pool's cloud-config layer to
# /etc/spire/agent.conf, with the drop-in image/systemd/spire-agent-x509pop.conf, in place
# of agent.conf. Placeholders: the trust domain and the server address.
agent {
  trust_domain = "sandbox.home.example"
  server_address = "spire-server.sandbox.home.example"
  server_port = "8081"
  trust_bundle_path = "/run/spire/bundle.json"
  trust_bundle_format = "spiffe"
  socket_path = "/run/spire/sockets/agent.sock"
  data_dir = "/var/lib/spire/agent"
  log_level = "INFO"
}

plugins {
  NodeAttestor "x509pop" {
    plugin_data {
      # Written by mediatore node-cert (crates/mediatore-guest/src/nodecert.rs): the key
      # never leaves the guest; cert.pem is the leaf followed by the host CA's chain (none
      # for a self-signed host CA). No intermediates_path: SPIRE refuses one that holds no
      # certificate, which is every self-signed host CA's case.
      private_key_path = "/run/spire/x509pop/key.pem"
      certificate_path = "/run/spire/x509pop/cert.pem"
    }
  }
  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }
  WorkloadAttestor "unix" {
    plugin_data {
      # unix:uid, unix:user and unix:path selectors (ADR-0006 decision 5).
      discover_workload_path = true
    }
  }
}
