# The SPIRE agent on a pool VM (ADR-0018). Not baked into the image: the deployment's
# cloud-config layer writes it to /etc/spire/agent.conf beside the trust bundle
# (/etc/spire/bundle.pem, runbook Part 1.5) with the two placeholders replaced
# (ADR-0023; image/cloud-config-deployment.example.yaml). The node attests with its vTPM through the tpm attestor plugin from
# spiffe/spire-tpm-plugin, the same release the server runs (make dist-tpm-plugin puts
# the binary and its checksum in dist/); the agent ID becomes
# spiffe://<td>/spire/agent/tpm/<sha256 of the EK's PKIX DER>, which the broker's node
# and claim entries name as their parent (ADR-0006). The unix workload attestor is what
# those entries' selectors need. Placeholders: the trust domain and the server address.
agent {
  trust_domain = "sandbox.home.example"
  server_address = "spire-server.sandbox.home.example"
  server_port = "8081"
  trust_bundle_path = "/etc/spire/bundle.pem"
  socket_path = "/run/spire/sockets/agent.sock"
  data_dir = "/var/lib/spire/agent"
  log_level = "INFO"
}

plugins {
  NodeAttestor "tpm" {
    plugin_cmd = "/usr/lib/spire/tpm_attestor_agent"
    # sha256 of the binary make dist-tpm-plugin extracts (v1.11.3).
    plugin_checksum = "ffb7e266c7a10a7b1bdb349409d6c2ded8090715770287813055431cb692575c"
    plugin_data {
      # The Proxmox extension is off: libvirt and Cloud Hypervisor VMs are the EK alone
      # (ADR-0018 decision 4).
      pve { enabled = false }
    }
  }
  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }
  WorkloadAttestor "unix" {
    plugin_data {
      # unix:uid, unix:user and unix:path selectors (ADR-0006 decision 5).
      discover_workload_path = true
    }
  }
}
