#
# The sandbox VM's kernel settings (ADR-0023), applied by systemd-sysctl at every boot.
#
# Yama's ptrace scope: a process may trace its descendants only, not every process of the
# same uid. Debian 13 ships 0. The egress proxy holds the claim's tokens as the same uid as
# the workload (ADR-0025); what keeps the workload out of its memory is the jail's PID
# namespace and absent /proc, and this is the second line behind them (roadmap 06).
kernel.yama.ptrace_scope = 1
