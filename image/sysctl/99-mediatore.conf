#
# The sandbox VM's kernel settings (ADR-0023), applied by systemd-sysctl at every boot.
#
# Yama's ptrace scope: a process may trace its descendants only, not every process of the
# same uid. Debian 13 ships 0. The egress proxy holds the claim's tokens as the same uid as
# the workload (ADR-0025); what keeps the workload out of its memory is the jail's PID
# namespace and absent /proc, and this is the second line behind them (roadmap 06).
kernel.yama.ptrace_scope = 1
# No MPTCP: the jail's table and Landlock's connect rule are written for plain TCP, and a
# second kind of stream socket is one more thing for a kernel change to let past them.
net.mptcp.enabled = 0
# No io_uring for any process: nothing in the image uses it, and its operations are a way
# to issue socket calls beside the system calls a filter names (ADR-0051).
kernel.io_uring_disabled = 2
# Kernel addresses hidden in /proc and the logs from every uid, root included.
kernel.kptr_restrict = 2
# The kernel log readable with CAP_SYSLOG alone, never by the sandbox uid.
kernel.dmesg_restrict = 1
# bpf() for privileged callers alone; 1 cannot be lowered again until the next boot.
kernel.unprivileged_bpf_disabled = 1
# The BPF JIT hardened (constants blinded) for every user.
net.core.bpf_jit_harden = 2
