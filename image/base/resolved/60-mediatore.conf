#
# systemd-resolved on every mediatore VM, the pool's and the gateways', installed by the VM base
# (image/base/Dockerfile) as /usr/lib/systemd/resolved.conf.d/60-mediatore.conf. A VM asks the
# resolver its link was given (DNS= in a networkd file, or DHCP's) and nobody else: the names it
# resolves are a claim's, private ones among them.
[Resolve]
# No global servers, and so no reading of /etc/resolv.conf. The Kairos base shipped
# /etc/resolv.conf as a plain file naming two public resolvers; while /etc/resolv.conf is a file
# and not resolved's own, resolved imports its servers as global ones and answers every name
# through them beside the link's (seen in the built image, 2026-11-28; a gateway after its host
# rebooted sent every name, private ones included, to a public resolver). An assignment here,
# even an empty one, stops that import. (The base also replaces that file: image/base/resolv.conf.)
DNS=
# No fallback servers either: systemd 257 as Debian builds it has none, a base built otherwise
# may, and they would be used while the link has no resolver yet. With both lists empty a VM
# whose link has no resolver fails its lookups visibly instead.
FallbackDNS=
# The stub on 127.0.0.53: the gateway's Envoys ask it alone (image/gateway/resolve), and it
# follows the link's servers as networkd sets and changes them.
DNSStubListener=yes
# No name is ever resolved by multicast: a host on the egress LAN, or a VM on a sandbox segment,
# could answer an LLMNR or mDNS query with an address of its choosing.
LLMNR=no
MulticastDNS=no
