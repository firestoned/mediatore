#
# /etc/resolv.conf as the VM base ships it (image/base/Dockerfile), in place of the Kairos base's,
# which named two public resolvers. Kairos replaces this file at every boot, in its initramfs
# stage, with a link to /run/systemd/resolve/resolv.conf (the link's servers, as resolved knows
# them); until it does, or on a boot where it does not, anything that reads this file asks
# resolved's stub, which knows the link's servers alone (image/base/resolved/60-mediatore.conf),
# never a public resolver. No search line.
nameserver 127.0.0.53
options edns0 trust-ad
