# The deployment's layer of the sandbox VM image's cloud-config (ADR-0023 decision 3): the
# install block and what the image deliberately does not carry, the SPIRE agent's
# configuration and the trust bundle. Copy it outside the repository, replace the
# placeholders, and store it as the third cloud-config Secret the overlay's vmimage.yaml
# names. Public material only: the bundle is the same for every member by design
# (banlieue ADR-0108 decision 2); the agent's key is generated on each member's first
# boot onto the sealed persistent partition and never appears here.
install:
  auto: true
  device: auto
  # Deferred mode (banlieue ADR-0040): each member runs this install at its own first boot,
  # with its own vTPM attached, and seals the persistent partition to it.
  reboot: true
  poweroff: false
  encrypted_partitions:
    - COS_PERSISTENT
# Console break-glass only: the image has no sshd (ADR-0010). A hashed password, or
# `install.nousers: true` for a member nobody can log in to.
users:
  - name: kairos-admin
    groups: ["admin"]
    passwd: "$6$replace-me$with-a-hash-from-mkpasswd"
stages:
  initramfs:
    # /etc is an ephemeral overlay on Kairos: written at every boot, from this layer.
    - name: spire-agent-config
      files:
        - path: /etc/spire/bundle.pem
          permissions: 0644
          owner: 0
          group: 0
          # `spire-server bundle show` on your SPIRE server (deploying guide, step 6).
          content: |
            -----BEGIN CERTIFICATE-----
            ...your trust bundle...
            -----END CERTIFICATE-----
        - path: /etc/spire/agent.conf
          permissions: 0644
          owner: 0
          group: 0
          # image/spire/agent.conf with the two placeholders replaced: the trust domain
          # and the server's address. The plugin path and checksum stay as they are. With
          # egress gateways the server address is a gateway's sandbox address and the
          # control relay's SPIRE port (ADR-0027 decision 3): the segment has no route
          # and no resolver, so a name or the server's own address would reach nothing.
          # Without gateways yet, the server's name or address as the segment reaches it.
          content: |
            agent {
              trust_domain = "sandbox.home.example"
              server_address = "198.51.100.1"
              server_port = "3129"
              trust_bundle_path = "/etc/spire/bundle.pem"
              socket_path = "/run/spire/sockets/agent.sock"
              data_dir = "/var/lib/spire/agent"
              log_level = "INFO"
            }
            plugins {
              NodeAttestor "tpm" {
                plugin_cmd = "/usr/lib/spire/tpm_attestor_agent"
                plugin_checksum = "ffb7e266c7a10a7b1bdb349409d6c2ded8090715770287813055431cb692575c"
                plugin_data {
                  pve { enabled = false }
                }
              }
              KeyManager "disk" {
                plugin_data {
                  directory = "/var/lib/spire/agent"
                }
              }
              WorkloadAttestor "unix" {
                plugin_data {
                  discover_workload_path = true
                }
              }
            }
    - name: mediatore-guest-env
      files:
        - path: /etc/mediatore-guest/env
          permissions: 0644
          owner: 0
          group: 0
          # image/env.example: the broker's sandbox listener, as the members reach it. With
          # egress gateways, a gateway's sandbox address and the control relay's broker
          # port (ADR-0027 decision 3), by address; without gateways yet, the
          # LoadBalancer's name or address and port (443 in deploy/base). Whole-line
          # comments only: systemd's EnvironmentFile keeps an inline comment as part of
          # the value.
          content: |
            MEDIATORE_URL=https://198.51.100.1:3130
            SPIFFE_ENDPOINT_SOCKET=/run/spire/sockets/agent.sock
            MEDIATORE_REGISTRY_CA=/etc/mediatore/registry-ca.pem
            RUST_LOG=info
    - name: mediatore-gateways
      files:
        # The pool's bootstrap list of egress gateways (ADR-0027 decision 4): the three
        # sandbox addresses and the data-plane port, one per line, the list the guest uses
        # when the broker's `gateways` is empty (the broker's wins otherwise). Leave the
        # file out on a pool with no gateway; the guest then dials directly and says so.
        - path: /etc/mediatore/gateways
          permissions: 0644
          owner: 0
          group: 0
          content: |
            198.51.100.1:8443
            198.51.100.2:8443
            198.51.100.3:8443
        # The registries on the segment (ADR-0029 decision 1): the mirror's address and
        # port, one per line, by address; what the host table admits for the pull beside
        # the gateways. The broker declares the same hosts with `reach: segment`.
        - path: /etc/mediatore/registries
          permissions: 0644
          owner: 0
          group: 0
          content: |
            198.51.100.10:5000
        # The mirror's CA when it serves HTTPS on your PKI (MEDIATORE_REGISTRY_CA in the
        # env above); leave it out for a plain-HTTP mirror named in
        # MEDIATORE_PLAIN_HTTP_REGISTRIES, pinning images by digest then.
        - path: /etc/mediatore/registry-ca.pem
          permissions: 0644
          owner: 0
          group: 0
          content: |
            -----BEGIN CERTIFICATE-----
            ...your registry CA...
            -----END CERTIFICATE-----
