#
# The runtime directories the gateway's units name in ReadWritePaths=, ReadOnlyPaths= and
# InaccessiblePaths= without the "-" prefix, made at boot by systemd-tmpfiles-setup.service,
# which runs before sysinit.target and so before every one of those units. systemd builds a
# unit's mount namespace before its first ExecStartPre, even a "+" one, and a named path that
# does not exist then fails the start with 226/NAMESPACE: the probes reader failed every run
# that way on a booted gateway (2026-11-27), because its directory was made in an
# ExecStartPre=+ of its own unit. Installed as /usr/lib/tmpfiles.d/mediatore-gateway.conf;
# image/gateway/check.sh runs it in the built image and checks every unit's bare paths
# against what it made. No age field: nothing here is ever cleaned.
#
# The runtime directory, root's and 0755, as mediatore-gateway-nft.service's
# RuntimeDirectory= also makes it: the authorizer and the Envoys mount it, the authorizer
# makes its socket directories (check, inject) below it at every start.
d /run/mediatore-gateway 0755 root root -
# The probes reader's summary (ADR-0070 decision 4): the reader's user owns it, the
# authorizer's group reads it, nobody else enters it; setgid, so the summary takes the
# directory's group without a chown (the reader's unit has RestrictSUIDSGID=yes and could
# not set the bit itself).
d /run/mediatore-gateway/probes 2750 mediatore-probes mediatore-gateway -
# The SPIRE agent's runtime directory and its socket directory, as spire-agent.service's
# RuntimeDirectory= and the base cloud-config's boot stage make them, but before any unit
# starts: the relay's InaccessiblePaths=/run/spire and the inject Envoy's
# ReadOnlyPaths=/run/spire/sockets name them bare, and neither unit is ordered after the agent.
d /run/spire 0755 spire spire -
d /run/spire/sockets 0755 spire spire -
