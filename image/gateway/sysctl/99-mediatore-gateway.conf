#
# The gateway VM's kernel settings (ADR-0028 decision 8, banlieue ADR-0109 decision 4),
# applied by systemd-sysctl at every boot. Forwarding off in both families: the gateway
# terminates the sandbox's connection and opens its own from the egress address; no
# packet crosses it, and the host table drops the forward hook as well. Yama's ptrace
# scope raised: the three services are three users, and this is the second line behind
# that.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
kernel.yama.ptrace_scope = 1
# No MPTCP: the host table and the three services are plain TCP.
net.mptcp.enabled = 0
# No io_uring for any process: Envoy does not use it unless configured to, and nothing
# else in the image does.
kernel.io_uring_disabled = 2
# Kernel addresses hidden in /proc and the logs from every uid, root included.
kernel.kptr_restrict = 2
# The kernel log readable with CAP_SYSLOG alone, by none of the service users.
kernel.dmesg_restrict = 1
# bpf() for privileged callers alone; 1 cannot be lowered again until the next boot.
kernel.unprivileged_bpf_disabled = 1
# The BPF JIT hardened (constants blinded) for every user.
net.core.bpf_jit_harden = 2
