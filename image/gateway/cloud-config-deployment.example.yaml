# The deployment's layer of the egress gateway VM image's cloud-config (ADR-0028 decision
# 10): the install block and what the image deliberately does not carry, the SPIRE agent's
# configuration, the trust bundle and the gateway's env file. Copy it outside the
# repository, replace the placeholders, and store it as the third cloud-config Secret
# deploy/gateway/vmimage.yaml names. Public material only: the bundle is the same for every
# gateway by design (banlieue ADR-0108 decision 2), the env file holds addresses and ports,
# and the agent's key is generated on each gateway's first boot onto the sealed persistent
# partition and never appears here. The sandbox address of each gateway is not here either:
# it is the VirtualMachine's userData (deploy/gateway/virtualmachines.yaml).
install:
  auto: true
  device: auto
  # Deferred mode (banlieue ADR-0040): each gateway runs this install at its own first
  # boot, with its own vTPM attached, and seals the persistent partition to it.
  reboot: true
  poweroff: false
  encrypted_partitions:
    - COS_PERSISTENT
# Console break-glass only: the image has no sshd (ADR-0028 decision 8). A hashed
# password, or `install.nousers: true` for a gateway nobody can log in to.
users:
  - name: kairos-admin
    groups: ["admin"]
    passwd: "$6$replace-me$with-a-hash-from-mkpasswd"
stages:
  initramfs:
    # /etc is an ephemeral overlay on Kairos: written at every boot, from this layer.
    - name: spire-agent-config
      files:
        - path: /etc/spire/bundle.pem
          permissions: 0644
          owner: 0
          group: 0
          # `spire-server bundle show` on your SPIRE server (deploying guide, step 6).
          content: |
            -----BEGIN CERTIFICATE-----
            ...your trust bundle...
            -----END CERTIFICATE-----
        - path: /etc/spire/agent.conf
          permissions: 0644
          owner: 0
          group: 0
          # image/spire/agent.conf with the two placeholders replaced. The gateway reaches
          # the SPIRE server on its egress side, directly: by address, since the gateway
          # is what resolves names for everyone else and needs none itself.
          content: |
            agent {
              trust_domain = "sandbox.home.example"
              server_address = "192.0.2.20"
              server_port = "8081"
              trust_bundle_path = "/etc/spire/bundle.pem"
              socket_path = "/run/spire/sockets/agent.sock"
              data_dir = "/var/lib/spire/agent"
              log_level = "INFO"
            }
            plugins {
              NodeAttestor "tpm" {
                plugin_cmd = "/usr/lib/spire/tpm_attestor_agent"
                plugin_checksum = "ffb7e266c7a10a7b1bdb349409d6c2ded8090715770287813055431cb692575c"
                plugin_data {
                  pve { enabled = false }
                }
              }
              KeyManager "disk" {
                plugin_data {
                  directory = "/var/lib/spire/agent"
                }
              }
              WorkloadAttestor "unix" {
                plugin_data {
                  discover_workload_path = true
                }
              }
            }
    - name: mediatore-gateway-env
      files:
        - path: /etc/mediatore-gateway/env
          permissions: 0644
          owner: 0
          group: 0
          # image/gateway/env.example with your values: the trust domain, the sandbox
          # NIC's name and prefix, the SPIRE server's and the broker's addresses on the
          # egress side, the broker's URL for the authorizer (https://BROKER_ADDRESS, with
          # :BROKER_PORT unless 443: the host table's output chain admits the authorizer
          # nowhere else, ADR-0053 decision 5). AUTHORIZER_ENDPOINT is the authorizer's check
          # socket and CHECK_TCP_ELEMENTS empty: leave both as they are (the authorizer's unit
          # listens where the first says and refuses to start when the two disagree; loopback
          # TCP is an explicit choice, env.example says how). EGRESS_DENY_ELEMENTS takes the addresses and
          # ranges no sandbox should reach through a gateway, as ", 10.0.0.0/8, ...": your
          # Kubernetes API, secrets store and identity provider at least. The agent.conf
          # above must name SPIRE_SERVER_ADDRESS and SPIRE_SERVER_PORT: the same chain
          # admits the agent nowhere else. Whole-line comments only.
          content: |
            TRUST_DOMAIN=sandbox.home.example
            SANDBOX_IF=enp2s0
            SANDBOX_PREFIX=24
            DATA_PORT=8443
            RELAY_SPIRE_PORT=3129
            RELAY_BROKER_PORT=3130
            RELAY_BUNDLE_PORT=3131
            RELAY_CAP=16
            SPIRE_SERVER_ADDRESS=192.0.2.20
            SPIRE_SERVER_PORT=8081
            SPIRE_BUNDLE_ADDRESS=192.0.2.20
            SPIRE_BUNDLE_PORT=8443
            BROKER_ADDRESS=192.0.2.21
            BROKER_PORT=443
            EGRESS_DENY_ELEMENTS=
            CHECK_TCP_ELEMENTS=
            RESOLVER_ELEMENTS=
            AUTHORIZER_ENDPOINT=pipe: { path: /run/mediatore-gateway/check/check.sock }
            SPIRE_SOCKET=/run/spire/sockets/agent.sock
            TUNNEL_MAX_SECS=86400
            INJECT_PORT=3133
            INJECT_HOST=api.upstream.example.com
            INJECT_UPSTREAM_PORT=443
            INJECT_DOMAIN=api.upstream.example.com
            INJECT_CA_FILE=/etc/ssl/certs/ca-certificates.crt
            INJECT_STREAM_IDLE_SECS=300
            INJECT_MAX_STREAM_SECS=3600
            INJECT_AUTHORIZER_SOCKET=/run/mediatore-gateway/inject/inject.sock
            INJECT_PORT_ELEMENT=
            MEDIATORE_URL=https://192.0.2.21
            SPIFFE_ENDPOINT_SOCKET=unix:///run/spire/sockets/agent.sock
            RUST_LOG=info
    # TURN THE INJECT ENVOY ON (ADR-0040): off by default. The unit is in the image and not enabled. To enable it, (1) in the env above, replace
    # INJECT_PORT_ELEMENT with the line of image/gateway/env.inject.example, set INJECT_HOST, INJECT_DOMAIN and INJECT_UPSTREAM_PORT to the upstream, keep
    # INJECT_PORT equal to the broker's gateway_inject_port, and leave AUTHORIZER_ENDPOINT and CHECK_TCP_ELEMENTS as above: the data plane is on the CHECK
    # socket already, the image's default, and inject is not for a gateway that keeps the check on loopback TCP; (2) add the step below, which gives the
    # authorizer its second socket, the INJECT socket, in a directory of its own beside the check socket's (the data plane's group reaches the check socket
    # only, envoy-inject's group the inject socket only; the setgid directories give each socket its group, and the image's unit already makes the check
    # socket's) and enables and starts the unit (enable alone never starts it here:
    # /etc is rebuilt at every boot and this stage runs after systemd has planned the boot, so 3133 would stay closed); (3) register `unix:user:envoy-inject` on the
    # listeners' SPIFFE ID, spiffe://<td>/gateway (the third entry of each VM in deploy/gateway/clusterstaticentries.yaml; the authorizer's
    # user holds spiffe://<td>/gateway/authorizer and nothing else, ADR-0053); (4) open the gateways' path to the upstream. The authorizer's
    # listen flags are those of the release that serves the two sockets (ADR-0040 stage C): check them with `mediatore gateway --help`. The drop-in
    # replaces the unit's ExecStart, so it names both sockets; its check directory line and its ReadWritePaths repeat what the image's unit now
    # does itself, so the same drop-in serves an image from before the check socket was the default.
    #
    # stages:
    #   boot:
    #     - name: mediatore-gateway-inject
    #       files:
    #         - path: /etc/systemd/system/mediatore-gateway.service.d/10-inject.conf
    #           permissions: 0644
    #           owner: 0
    #           group: 0
    #           content: |
    #             [Service]
    #             ExecStart=
    #             ExecStart=/usr/bin/mediatore gateway --check-socket /run/mediatore-gateway/check/check.sock --inject-socket /run/mediatore-gateway/inject/inject.sock --socket-dir-mode 2750
    #             ExecStartPre=+/usr/bin/install -d -m 2750 -o mediatore-gateway -g envoy /run/mediatore-gateway/check
    #             ExecStartPre=+/usr/bin/install -d -m 2750 -o mediatore-gateway -g envoy-inject /run/mediatore-gateway/inject
    #             ReadWritePaths=/run/mediatore-gateway
