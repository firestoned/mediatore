#
# The guest agent's allow-list on the egress gateway VM image (threat model R-43), installed
# as /etc/qemu/qemu-ga.conf. With allow-rpcs set, qemu-ga refuses every command not named
# here (QEMU 7.2 and later; Debian 13 ships 10.x), so the hypervisor's end of the channel
# is no longer a root shell in the gateway: no guest-exec, no guest-file-write, no
# guest-set-user-password, no guest-ssh-add-authorized-keys.
#
# What is listed is what the hypervisor side sends, and nothing else:
#   guest-sync, guest-sync-delimited   libvirt's handshake before any command
#   guest-ping                         banlieue's libvirt provider, to tell "no marker
#                                      yet" from "no agent" (banlieue ADR-0043 decision 8)
#   guest-info                         the agent's own inventory, for whoever debugs it
#   guest-file-open, guest-file-read,  the provider reads /run/banlieue/phase (where a
#   guest-file-close                   layer writes it), /run/banlieue/ek.pem (the EK
#                                      certificate of a tpmEnabled VM) and
#                                      /run/banlieue/sealed, opened with mode "r"
#   guest-network-get-interfaces       the VM's addresses (libvirt's agent source, and
#                                      Proxmox's agent/network-get-interfaces)
#
# What is left, and this file cannot narrow: the allow-list is by command, not by
# argument, so guest-file-open with guest-file-read still reads any file root can read,
# and guest-file-open with a writing mode can create or truncate one although nothing can
# be written into it.
#
# A banlieue provider that starts sending another command needs it added here first, or
# the gateway never publishes its EK certificate or its addresses. image/gateway/check.sh
# asserts this list.
[general]
allow-rpcs=guest-sync-delimited,guest-sync,guest-ping,guest-info,guest-file-open,guest-file-read,guest-file-close,guest-network-get-interfaces
