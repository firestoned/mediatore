#
# What the two Envoys of an egress gateway read as /etc/resolv.conf: their units bind this
# directory (/usr/share/mediatore-gateway/resolve) over /run/systemd/resolve, where Kairos's
# /etc/resolv.conf points, so they ask systemd-resolved's stub and nothing else. The stub follows
# the egress link's servers as they are set and changed; a resolv.conf with the link's servers
# in it is read once, at start, and kept (a gateway that started before its link had a resolver
# kept the fallback ones). A directory is bound, not the file: resolved replaces its files by
# rename, and a rename detaches a file bind in every other mount namespace. No search line: a
# name is asked as it was written.
nameserver 127.0.0.53
options edns0 trust-ad
