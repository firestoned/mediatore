[package]
name = "mediatore-guest"
description = "The VM side of the one mediatore binary (ADR-0014): the guest role (attest, fetch the subject, create the sandbox user, jail the workload) and the token role inside the jail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No doctests in this workspace: skip the rustdoc pass `cargo test` would run for none.
[lib]
doctest = false

[dependencies]
mediatore-proto.workspace = true
mediatore-tls.workspace = true
reqwest.workspace = true
# The egress proxy (ADR-0025): HTTP/1.1 on both legs, the upstream over rustls to the Mozilla roots.
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
# Tripwires (ADR-0069): the proxy's matcher over a streamed body (decision 6), and the
# checksum of a generated credential (decision 3).
http-body.workspace = true
bytes.workspace = true
aho-corasick.workspace = true
percent-encoding.workspace = true
crc32fast.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
# The phantom token (ADR-0025 decision 3): 256 bits from the provider the TLS stack runs on.
aws-lc-rs.workspace = true
async-trait.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
sha2.workspace = true
hex.workspace = true
# Redaction (ADR-0045 decision 2): the base64 forms of a secret the jail was given.
base64.workspace = true
tar.workspace = true
flate2.workspace = true
# The node-cert role (ADR-0049 Decision 5, amended 2026-11-24): the guest's EC P-256 key and
# CSR on the aws-lc-rs provider, and the host's reply parsed as X.509, all in process.
rcgen = { workspace = true, features = ["pem"] }
x509-cert.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The vsock report to a Cloud Hypervisor host (ADR-0019 decision 2); vsock is a Linux socket family.
[target.'cfg(target_os = "linux")'.dependencies]
socket2.workspace = true
# Landlock for the jail's inner layer, applied by `jail-exec` (ADR-0024); Linux's LSM.
nono.workspace = true
# The seccomp denylist applied after Landlock by `jail-exec` (ADR-0051): Apache-2.0 OR BSD-3-Clause,
# rust-vmm, no TLS and no `ring`; `libc` for the syscall numbers it compiles against.
seccompiler.workspace = true
libc.workspace = true

[dev-dependencies]
mediatore-testkit.workspace = true
# node-cert: a private directory per test, and the fake signer's validity times.
tempfile.workspace = true
time.workspace = true

[features]
# `--dev-spiffe-id`: a peer-identity header instead of mTLS, for the loopback dev loop only.
# Off in release builds (ADR-0007 decision 5).
dev = []

[lints]
workspace = true
