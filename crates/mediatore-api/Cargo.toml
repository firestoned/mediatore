[package]
name = "mediatore-api"
description = "axum routers for the user-facing (bearer) and sandbox-facing (SPIFFE mTLS) endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No doctests in this workspace: skip the rustdoc pass `cargo test` would run for none.
[lib]
doctest = false

[dependencies]
mediatore-proto.workspace = true
mediatore-store.workspace = true
mediatore-entra.workspace = true
mediatore-sts.workspace = true
mediatore-spire.workspace = true
mediatore-tls.workspace = true
mediatore-claims.workspace = true
banlieue-api.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
base64.workspace = true
uuid.workspace = true
tracing.workspace = true
anyhow.workspace = true
# The NDJSON body of `GET /v1/claims/{name}/logs` is a channel drained as a stream (ADR-0045).
futures.workspace = true

[dev-dependencies]
# The handler tests drive the real routers in process (`oneshot`), build a verified bundle for the
# policy cases, and capture the audit line to prove a credential is never logged (ADR-0040).
mediatore-testkit.workspace = true
mediatore-policy.workspace = true
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true
# A counting front door, to prove a refused namespace issues no read (ADR-0046 decision 5).
async-trait.workspace = true

[lints]
workspace = true
