[package]
name = "mediatore-proto"
description = "Shared wire types between the broker, the guest role and the token role of the one mediatore binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No doctests in this workspace: skip the rustdoc pass `cargo test` would run for none.
[lib]
doctest = false

[dependencies]
serde.workspace = true
uuid.workspace = true
jiff.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
x509-cert.workspace = true
rustls.workspace = true   # the aws-lc-rs provider, installed by tls::ensure_provider (ADR-0007)
webpki-roots.workspace = true

[dev-dependencies]
serde_json.workspace = true
rcgen = { workspace = true, features = ["pem"] }   # PEM output for the x509pop leaf fixtures
base64.workspace = true

[lints]
workspace = true
