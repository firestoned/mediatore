[package]
name = "mediatore-gateway"
description = "The egress gateway's authorizer (ADR-0028 decision 4): Envoy's external authorization service, answering each CONNECT from a bounded cache of what the broker says a claim may reach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No doctests in this workspace: skip the rustdoc pass `cargo test` would run for none.
[lib]
doctest = false

[dependencies]
mediatore-proto.workspace = true
mediatore-spire.workspace = true
mediatore-tls.workspace = true
reqwest.workspace = true
async-trait.workspace = true
envoy-types.workspace = true
tonic.workspace = true
tokio.workspace = true
clap.workspace = true
jiff.workspace = true
uuid.workspace = true
# The sweep's bounded concurrency over the claims that hold a credential (ADR-0040 decision 5).
futures.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
# The check service on a unix socket: tonic's incoming stream over `tokio::net::UnixListener` (ADR-0040 decision 6).
tokio-stream = { version = "0.1", features = ["net"] }

[dev-dependencies]
mediatore-testkit.workspace = true
# A real gRPC client over the unix socket, and the captured tracing output of a check.
tower = { workspace = true, features = ["util"] }
hyper-util.workspace = true
tracing-subscriber.workspace = true

[features]
# `--dev-spiffe-id`: the gateway identity as a header against a loopback `dev_mode` broker,
# for the dev loop only. Off in release builds (ADR-0007 decision 5).
dev = []

[lints]
workspace = true
