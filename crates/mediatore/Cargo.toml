[package]
name = "mediatore"
description = "mediatore: identity broker for banlieue sandbox VMs; the one binary with every role as a subcommand (ADR-0014)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mediatore"
path = "src/main.rs"

[dependencies]
mediatore-proto.workspace = true
mediatore-api.workspace = true
mediatore-entra.workspace = true
mediatore-sts.workspace = true
mediatore-spire.workspace = true
mediatore-tls.workspace = true
kube.workspace = true
mediatore-store.workspace = true
mediatore-claims.workspace = true
mediatore-guest.workspace = true
mediatore-client.workspace = true
tokio.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[features]
# The loopback header path of the guest and token roles (`--dev-spiffe-id`), for the dev
# loop only. `make dist`, the Dockerfile and the build workflow never enable it (ADR-0007
# decision 5, ADR-0014 decision 2).
dev = ["mediatore-guest/dev"]

[dev-dependencies]
mediatore-proto.workspace = true
async-trait.workspace = true
base64.workspace = true
banlieue-api.workspace = true
k8s-openapi.workspace = true
serde_json.workspace = true
rustls.workspace = true
mediatore-testkit.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
uuid.workspace = true
tempfile.workspace = true

[lints]
workspace = true
