[package]
name = "sandbox-token"
description = "Workload-side CLI: fetch the claim SVID and ask mediatore for an audience-scoped token"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sandbox-token"
path = "src/main.rs"

[dependencies]
mediatore-proto.workspace = true
mediatore-tls.workspace = true
tokio.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[features]
# `--dev-spiffe-id`: a peer-identity header instead of mTLS, for the loopback dev loop only.
# Off in release builds (ADR-0007 decision 5).
dev = []

[lints]
workspace = true
