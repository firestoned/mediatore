[graph]
all-features = true

[advisories]
ignore = [
  # Marvin timing side channel in the `rsa` crate; no patched release exists.
  # Pulled in by jsonwebtoken's rust_crypto backend, but mediatore signs and
  # verifies ES256 (P-256) exclusively, so the RSA code path is never
  # exercised. Revisit when RustCrypto/RSA#19 lands a constant-time fix or
  # jsonwebtoken makes the rsa dependency optional per algorithm.
  { id = "RUSTSEC-2023-0071", reason = "RSA never used; ES256-only token signing/verification" },
]

[licenses]
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "OpenSSL", "CC0-1.0", "MPL-2.0",
  # webpki-roots: permissive data license for the Mozilla root store
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# in-repo path dependencies carry no version; they are not wildcards in the supply-chain sense
allow-wildcard-paths = true
deny = [
  { name = "openssl-sys", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/firestoned/banlieue"]
