[graph]
all-features = true

[advisories]
# No ignores. jsonwebtoken runs on aws-lc-rs (Cargo.toml), so the `rsa` crate's Marvin
# side channel (RUSTSEC-2023-0071) and the crypto-bigint 0.5 line (RUSTSEC-2026-0387)
# are out of the tree rather than waived.
ignore = []

[licenses]
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "OpenSSL", "CC0-1.0", "MPL-2.0",
  # webpki-roots: permissive data license for the Mozilla root store
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# in-repo path dependencies carry no version; they are not wildcards in the supply-chain sense
allow-wildcard-paths = true
deny = [
  { name = "openssl-sys", reason = "rustls only" },
  { name = "ring", reason = "aws-lc-rs is the only rustls provider (ADR-0007)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/firestoned/banlieue"]
