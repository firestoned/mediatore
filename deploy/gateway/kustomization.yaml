#
# The egress gateway's objects (ADR-0028 decisions 2 and 10, ADR-0027): the VMImage built
# from image/gateway/Dockerfile and its two-interface class, the three VirtualMachines, one
# per failure domain, with the sandbox address of each as its userData, and the
# ClusterStaticEntry pairs that give the data plane and the authorizer on each the identity
# spiffe://<td>/gateway. Every address, hash and name is a placeholder: copy this directory
# outside the repository, put your own values in, and keep it there. banlieue gains no kind
# for any of it (banlieue ADR-0109 decision 5). `make manifests` renders it as a check.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: banlieue-system
resources:
  - vmimage.yaml
  - virtualmachines.yaml
  - clusterstaticentries.yaml
