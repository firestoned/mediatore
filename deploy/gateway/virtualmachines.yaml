#
# The three egress gateways (ADR-0028 decision 10, banlieue ADR-0109 decision 4): ordinary
# VirtualMachines of the two-interface class, the egress address of each in its
# networkOverrides (banlieue writes it as the first static NIC), the sandbox address of each
# in its userData (the image writes it: vm.env, image/gateway/vm.env.example), spread one
# per failure domain by a required anti-affinity on the host key (banlieue ADR-0098). The
# three sandbox addresses are what the pool's /etc/mediatore/gateways and the broker's
# `gateways` list, in any order. Placeholders throughout.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-01-vm-env
  labels: { mediatore.io/role: gateway }
data:
  user-data: |
    #cloud-config
    stages:
      initramfs:
        - name: mediatore-gateway-vm-env
          files:
            - path: /etc/mediatore-gateway/vm.env
              permissions: 0644
              owner: 0
              group: 0
              content: |
                SANDBOX_ADDRESS=198.51.100.1
            # The egress NIC's static address, written by the guest from banlieue's placeholders
            # (banlieue ADR-0114 decision 4): a Kairos guest reads no network-config from its
            # seed, so `networkOverrides` below reaches it only through this stage; banlieue
            # renders ${IP}, ${PREFIX}, ${GATEWAY} and ${DNS} from the first static
            # interface. Name= is the first NIC's name on your machine type (`ens2` on a
            # libvirt pc-i440fx machine, `enp1s0` on q35, `ens4` on Cloud Hypervisor); the
            # sandbox NIC is SANDBOX_IF in the deployment layer's env (`ens3` on pc-i440fx,
            # `ens5` on Cloud Hypervisor), so the two never match the same file. A gateway
            # moved to another backend needs both names changed: Kairos's DHCP catch-all takes
            # an unmatched NIC, and the nftables rules key on SANDBOX_IF.
            - path: /etc/systemd/network/10-egress.network
              permissions: 0644
              owner: 0
              group: 0
              content: |
                [Match]
                Name=ens2
                [Network]
                Address=${IP}/${PREFIX}
                Gateway=${GATEWAY}
                DNS=${DNS}
---
apiVersion: banlieue.io/v1alpha1
kind: VirtualMachine
metadata:
  name: gateway-01
  labels: { mediatore.io/role: gateway }
spec:
  classRef: { name: gateway-standard }
  imageRef: { name: mediatore-gateway }
  desiredPowerState: PoweredOn
  networkOverrides:
    - name: egress
      static: { address: 192.0.2.11, prefix: 24, gateway: 192.0.2.1, nameservers: [192.0.2.53] }
  userData:
    configMapRef: { name: gateway-01-vm-env }
  placement:
    antiAffinity:
      - labelSelector: { matchLabels: { mediatore.io/role: gateway } }
        topologyKey: host
        mode: required
---
