#
# Least privilege for the broker ServiceAccount:
# - AgentSandbox (ADR-0008): the user API creates and deletes them for the
#   subjects it validated; the reconciler reads them and patches the status
#   and its finalizer. `agentsandboxes/finalizers` update is what the API
#   server's owner-references plugin demands for the claim's
#   blockOwnerDeletion. The subject admission policy exempts this
#   ServiceAccount from the caller-equals-subject check; its token validation
#   is the control there.
# - VirtualMachineClaim: create/delete/watch (ADR-0002); status read for binding.
# - VirtualMachine: read-only, for node resolution and the EK certificate
#   (banlieue ADR-0045) the node entry is derived from.
# - ClusterStaticEntry: declare and retract the two entry shapes (ADR-0006).
#   No update/patch (entries are replaced, never edited) and nothing on
#   ClusterSPIFFEID or ClusterFederatedTrustDomain. The shape of what this
#   ServiceAccount may declare is further restricted at admission by
#   deploy/base/admission/clusterstaticentry-mediatore.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mediatore
rules:
  - apiGroups: ["mediatore.io"]
    resources: ["agentsandboxes"]
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
  - apiGroups: ["mediatore.io"]
    resources: ["agentsandboxes/status"]
    verbs: ["patch"]
  - apiGroups: ["mediatore.io"]
    resources: ["agentsandboxes/finalizers"]
    verbs: ["update"]
  - apiGroups: ["banlieue.io"]
    resources: ["virtualmachineclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["banlieue.io"]
    resources: ["virtualmachineclaims/status"]
    verbs: ["get"]
  - apiGroups: ["banlieue.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterstaticentries"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mediatore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mediatore
subjects:
  - kind: ServiceAccount
    name: mediatore
    namespace: banlieue-system
---
# Leader election for the claim watcher (ADR-0011 decision 6): one Lease, in the broker's
# own namespace. A Role rather than a ClusterRole rule because `create` cannot be bounded
# by resourceName; the namespace bounds it instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mediatore-watcher-lease
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["mediatore-watcher"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mediatore-watcher-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mediatore-watcher-lease
subjects:
  - kind: ServiceAccount
    name: mediatore
    namespace: banlieue-system
