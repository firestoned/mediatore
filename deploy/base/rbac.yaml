#
# Least privilege for the broker ServiceAccount:
# - AgentSandbox (ADR-0008): the user API creates and deletes them for the
#   subjects it validated; the reconciler reads them and patches the status
#   and its finalizer. `agentsandboxes/finalizers` update is what the API
#   server's owner-references plugin demands for the claim's
#   blockOwnerDeletion. The subject admission policy exempts this
#   ServiceAccount from the caller-equals-subject check; its token validation
#   is the control there.
# - VirtualMachineClaim: create/delete/watch (ADR-0002); status read for binding.
# - VirtualMachine: read-only, for node resolution and the EK certificate
#   (banlieue ADR-0045) the node entry is derived from.
# - Provider: list, nothing else, for the one public certificate a host's
#   administrator asserts inline (spec.attestation.hostCa), whose common name
#   names the x509pop agents of that host's guests (ADR-0049 decision 10).
#   Listed in every namespace, once per pass, and only while
#   watcher.x509pop_pools lists a pool: every Provider is read, not the
#   machine's alone, because two that assert different CAs under one common
#   name are refused both. No ConfigMap and no Secret is read for it: a hostCa
#   given as a reference is refused, not resolved.
# - ClusterStaticEntry: declare and retract the two entry shapes (ADR-0006).
#   No update/patch (entries are replaced, never edited) and nothing on
#   ClusterSPIFFEID or ClusterFederatedTrustDomain. The shape of what this
#   ServiceAccount may declare is further restricted at admission by
#   deploy/base/admission/clusterstaticentry-mediatore.yaml.
#
# The ClusterRole holds no verb on the core group (no Secret, no ConfigMap) and
# none on the store's two namespaced kinds: SandboxNode and PolicyFloor are used
# in the broker's own namespace only and are granted there, by the
# mediatore-store Role below (ADR-0056 decision 3 and open question 5). The
# ClusterRole's rules are pinned by a unit test
# (the_brokers_cluster_role_is_pinned, crates/mediatore-claims/src/sandbox.rs).
#
# Every namespaced grant below is in mediatore-system, the broker's own
# namespace (ADR-0056 decision 1, namespace.yaml). The broker holds nothing
# scoped to banlieue's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mediatore
rules:
  - apiGroups: ["mediatore.io"]
    resources: ["agentsandboxes"]
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
  - apiGroups: ["mediatore.io"]
    resources: ["agentsandboxes/status"]
    verbs: ["patch"]
  - apiGroups: ["mediatore.io"]
    resources: ["agentsandboxes/finalizers"]
    verbs: ["update"]
  - apiGroups: ["banlieue.io"]
    resources: ["virtualmachineclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["banlieue.io"]
    resources: ["virtualmachineclaims/status"]
    verbs: ["get"]
  - apiGroups: ["banlieue.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["banlieue.io"]
    resources: ["providers"]
    verbs: ["list"]
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterstaticentries"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mediatore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mediatore
subjects:
  - kind: ServiceAccount
    name: mediatore
    namespace: mediatore-system
---
# Leader election for the claim watcher (ADR-0011 decision 6): one Lease, in the broker's
# own namespace. A Role rather than a ClusterRole rule because `create` cannot be bounded
# by resourceName; the namespace bounds it instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mediatore-watcher-lease
  namespace: mediatore-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["mediatore-watcher"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mediatore-watcher-lease
  namespace: mediatore-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mediatore-watcher-lease
subjects:
  - kind: ServiceAccount
    name: mediatore
    namespace: mediatore-system
---
# The sealed sessions (ADR-0034 decision 2): one Secret per sandbox in the broker's own
# namespace, created by the API, claimed and rotated by the reconciler and the token
# endpoint, garbage-collected with the AgentSandbox that owns it when the sandboxes live
# here too, deleted by the retention sweep otherwise. Namespace-scoped on purpose: the
# broker reads no Secret elsewhere. A Role cannot name Secrets that do not exist yet, so
# the namespace is the bound: mediatore-system holds the broker's Secrets and nothing of
# banlieue's or a tenant's (ADR-0056 decision 1). The rules are pinned by a unit test
# (the_secrets_role_is_namespaced_and_its_rules_are_pinned).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mediatore-sessions
  namespace: mediatore-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mediatore-sessions
  namespace: mediatore-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mediatore-sessions
subjects:
  - kind: ServiceAccount
    name: mediatore
    namespace: mediatore-system
---
# The store's two namespaced kinds (ADR-0034 decision 3): attested nodes and the policy
# version floors, read and written in the broker's own namespace only. A Role here, not a
# ClusterRole rule (ADR-0056 open question 5): the grant covers the namespace the code
# uses and no other.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mediatore-store
  namespace: mediatore-system
rules:
  - apiGroups: ["mediatore.io"]
    resources: ["sandboxnodes", "policyfloors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mediatore-store
  namespace: mediatore-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mediatore-store
subjects:
  - kind: ServiceAccount
    name: mediatore
    namespace: mediatore-system
