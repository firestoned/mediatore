apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediatore
  labels: { app.kubernetes.io/name: mediatore }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: mediatore }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mediatore }
    spec:
      serviceAccountName: mediatore
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mediatore
          image: ghcr.io/firestoned/mediatore:dev
          args: ["serve", "--config", "/etc/mediatore/mediatore.yaml"]
          ports:
            - { name: user, containerPort: 8080 }
            - { name: sandbox, containerPort: 8443 }
          env:
            - { name: RUST_LOG, value: "info,mediatore=debug" }
            # Workload API socket delivered by the SPIFFE CSI driver (ADR-0007):
            # the SVID and its key are fetched into memory, never written to a volume.
            - { name: SPIFFE_ENDPOINT_SOCKET, value: "unix:///run/spire/sockets/spire-agent.sock" }
            # The store URL (ADR-0012): postgres://...?sslmode=verify-full with its password,
            # from a Secret the operator creates (deploy/base ships none); overrides store.url.
            - name: MEDIATORE_STORE_URL
              valueFrom:
                secretKeyRef: { name: mediatore-store, key: url }
          volumeMounts:
            - { name: config, mountPath: /etc/mediatore, readOnly: true }
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: user }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: mediatore-config }
        # Inline ephemeral CSI volume: a read-only bind mount of the agent's socket
        # directory. Admissible under Pod Security Standard "restricted", unlike a
        # hostPath (ADR-0007).
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
