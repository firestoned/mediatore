#
# What may be declared as one of the broker's SPIRE registration entries, and by
# whom (ADR-0006 decision 6, ADR-0056 decision 4). mediatore creates exactly two
# shapes (ADR-0004), each under one of two kinds of agent (ADR-0049 decision 11):
#
#   node   spiffe://<td>/banlieue/node/<key>   parent <agent>
#   claim  spiffe://<td>/banlieue/claim/<uid>  parent <agent>
#
#   <agent>  spiffe://<td>/spire/agent/tpm/<ek>                          a guest with a vTPM
#            spiffe://<td>/spire/agent/x509pop/<issuer CN>/<subject CN>  a guest without one
#
# Everything else is refused at admission, in the API server, by CEL (no
# webhook), so the restriction holds even if mediatore's own code is wrong.
# A SPIRE admin identity cannot be scoped like this; a ServiceAccount can.
# Requires Kubernetes 1.30+ (ValidatingAdmissionPolicy GA).
#
# <ek> is the hex SHA-256 of the EK's DER SubjectPublicKeyInfo (64 hex chars),
# the same value the tpm node attestor puts in the agent ID. <key>, the node key,
# is <ek> for a tpm agent's node, and the policy holds a node entry to that: the
# same hash on both sides. For an x509pop agent's node, <key> is the hex SHA-256
# of the agent ID itself (ADR-0049 decision 7): still 64 hex, so the spiffeID
# rule holds it to the shape, BUT THE POLICY CANNOT CHECK THAT IT IS THE HASH OF
# ITS PARENT. CEL has no hash function. So under an x509pop parent the broker's
# ServiceAccount, misused, could declare a node ID that is not that agent's own.
# It may already parent any claim's entry to any agent of the trust domain,
# which is its job; the difference is recorded as an accepted risk in the threat
# model (revisit when CEL gains a hash, or when an x509pop node's ID carries its
# names). The broker's own code cannot produce such an entry: a node entry's key
# is never an input, it is derived from the attestation together with the parent
# (node_entry_spec, crates/mediatore-spire/src/x509pop.rs). What that file's
# NodeIdentity::validate guards is the other shape, a claim entry, whose parent
# must be the agent its node key belongs to.
#
# The two segments of an x509pop agent ID are the common names of the host's CA
# and of the guest's certificate: 1 to 64 of letters, digits, dot, dash and
# underscore each, and neither "." nor ".." (ADR-0049 decision 2). Exactly two:
# a third segment, or a character outside the alphabet, is refused.
#
# The policy judges an entry by what it is, not only by who sends it. It claims
# every CREATE and UPDATE that the broker's ServiceAccount sends, and from any
# other principal every entry that is the broker's by one of three signs: a name
# beginning with mediatore-, the label app.kubernetes.io/managed-by: mediatore
# (the one the broker sets, crates/mediatore-spire/src/lib.rs), or a spiffeID
# whose path is under /banlieue/ in any trust domain. Whatever it claims is held
# to the two shapes, and its first validation says such an entry is the broker's
# alone to declare. An UPDATE that leaves spec as it was is not a declaration
# (the garbage collector removing a finalizer, an annotation) and is admitted
# from anyone, if the object is still of a permitted shape. DELETE is not
# matched: retracting an entry by hand stays RBAC's.
#
# The ServiceAccount is not a literal here: its username is the key `broker` of
# the ConfigMap mediatore-agentsandbox-subject-policy in the broker's namespace
# (agentsandbox-subject.yaml), read through `params` by the match condition and
# by the sender validation, the same value agentsandbox-subject.yaml and
# agentsandbox-status.yaml read (ADR-0056 decision 4). A kustomize `namespace:`
# does not rewrite a string inside a ConfigMap's data, nor `paramRef.namespace`:
# AN OVERLAY THAT RENAMES THE ServiceAccount OR MOVES IT TO ANOTHER NAMESPACE
# PATCHES THE `broker` VALUE AND THE FOUR BINDINGS' `paramRef.namespace`
# (clusterspiffeid.yaml's is the fourth, ADR-0075).
# Forgetting to used to leave the broker's entries unjudged, with no error
# anywhere (the policy matched nothing the broker sent). It now refuses them:
# the entries are still claimed by their names, the sender validation fails, no
# sandbox binds, and the broker says so when it starts and at each resync (its
# self-check, ADR-0056 decision 5, crates/mediatore-spire/src/kube.rs).
#
# The parameter is namespaced and ClusterStaticEntry is cluster-scoped, so the
# binding names the parameter's namespace (`paramRef.namespace`); a cluster-
# scoped request has no namespace of its own to default to. With the ConfigMap
# absent (parameterNotFoundAction: Deny) or the key absent (the expressions
# fail, failurePolicy: Fail), EVERY create and update of a ClusterStaticEntry
# is refused, the gateway's entries included, because the parameter is resolved
# before the match condition is. That is the fail-closed side: restore the
# ConfigMap (agentsandbox-subject.yaml) to declare anything.
#
# The gateway's entries (clusterstaticentry-gateway.yaml: gateway-*, a path of
# /gateway or under it, labelled mediatore.io/role: gateway) carry none of the
# three signs and are not claimed here from the platform team. An entry that
# carries one of them AND a /gateway path is claimed by both policies and can
# satisfy neither's spiffeID rule: refused, as the broker's ServiceAccount
# asking for a gateway ID always was. So a gateway entry must not be named
# mediatore-* nor carry the managed-by label.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mediatore-clusterstaticentry
  labels:
    app.kubernetes.io/name: mediatore
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["spire.spiffe.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterstaticentries"]
  # One condition, a disjunction (conditions are ANDed, so the four tests cannot be
  # four conditions): the sender is the broker's ServiceAccount, or the object is
  # the broker's by its name, its label or its path. Each object test is guarded
  # with has(), so an object without labels or a spiffeID is a non-match on that
  # test and never an evaluation error. Anything else is governed by RBAC and, for
  # /gateway, by clusterstaticentry-gateway.yaml.
  matchConditions:
    - name: is-from-the-broker-or-is-one-of-its-entries
      expression: >-
        request.userInfo.username == params.data.broker.trim() ||
        (has(object.metadata.name) && object.metadata.name.startsWith('mediatore-')) ||
        (has(object.metadata.labels) && 'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'mediatore') ||
        (has(object.spec) && has(object.spec.spiffeID) && object.spec.spiffeID.matches('^spiffe://[^/]+/banlieue/'))
  variables:
    - name: td
      expression: "'^spiffe://[a-z0-9.-]+'"
    - name: hex64
      expression: "'[0-9a-f]{64}'"
    # One segment of an x509pop agent ID: a certificate's common name (ADR-0049 decision 2).
    - name: seg
      expression: "'[A-Za-z0-9._-]{1,64}'"
    - name: uuid
      expression: "'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'"
    - name: isNode
      expression: "object.spec.spiffeID.contains('/banlieue/node/')"
    - name: isClaim
      expression: "object.spec.spiffeID.contains('/banlieue/claim/')"
    # The parent is the agent of a guest with a vTPM.
    - name: tpmParent
      expression: "object.spec.parentID.matches(variables.td + '/spire/agent/tpm/' + variables.hex64 + '$')"
    # The parent is the agent of a guest without one: exactly an issuer and a subject
    # segment, neither of them "." or "..".
    - name: x509popParent
      expression: >-
        object.spec.parentID.matches(variables.td + '/spire/agent/x509pop/' + variables.seg + '/' + variables.seg + '$') &&
        !object.spec.parentID.matches('/[.]{1,2}(/|$)')
  validations:
    # Who: first, so that a broker this policy does not name is told exactly that,
    # whatever else is wrong with what was sent. The message is read by the broker's
    # self-check (ENTRIES_POLICY_SENDER_MESSAGE, crates/mediatore-spire/src/lib.rs)
    # and held to it by a unit test: change both or neither.
    - expression: >-
        request.userInfo.username == params.data.broker.trim() ||
        (request.operation == 'UPDATE' && oldObject.spec == object.spec)
      message: "an entry named mediatore-*, labelled app.kubernetes.io/managed-by=mediatore or under /banlieue/ is the broker's alone to declare, and this request is not from the broker's ServiceAccount as this policy spells it"
      reason: Forbidden
    - expression: "object.metadata.name.startsWith('mediatore-')"
      message: "mediatore may only declare entries named mediatore-*"
      reason: Forbidden
    - expression: >-
        object.spec.spiffeID.matches(variables.td + '/banlieue/(node/' + variables.hex64 + '|claim/' + variables.uuid + ')$')
      message: "spiffeID must be spiffe://<td>/banlieue/node/<node-key> or spiffe://<td>/banlieue/claim/<uuid>"
      reason: Forbidden
    - expression: "variables.tpmParent || variables.x509popParent"
      message: "parentID must be a tpm agent ID, spiffe://<td>/spire/agent/tpm/<ek-hash>, or an x509pop agent ID, spiffe://<td>/spire/agent/x509pop/<issuer-cn>/<subject-cn>"
      reason: Forbidden
    - expression: "object.spec.spiffeID.split('/')[2] == object.spec.parentID.split('/')[2]"
      message: "spiffeID and parentID must be in the same trust domain"
      reason: Forbidden
    # A node entry may only be parented to its own agent. Under a tpm agent: the same EK
    # hash on both sides. Under an x509pop agent the node key is a SHA-256 of the parent,
    # which CEL cannot compute, so the rule is skipped there (see the header). A parent
    # that is neither is refused by the validation above, and is not judged here.
    - expression: >-
        !variables.isNode || !variables.tpmParent ||
        object.spec.spiffeID.split('/banlieue/node/')[1] == object.spec.parentID.split('/spire/agent/tpm/')[1]
      message: "a node entry's EK hash must equal its parent agent's EK hash"
      reason: Forbidden
    - expression: "size(object.spec.selectors) > 0 && object.spec.selectors.all(s, s.startsWith('unix:'))"
      message: "selectors must be unix workload selectors"
      reason: Forbidden
    - expression: "!variables.isNode || object.spec.selectors.exists(s, s == 'unix:uid:0')"
      message: "a node entry must select unix:uid:0"
      reason: Forbidden
    - expression: >-
        !variables.isClaim ||
        (size(object.spec.selectors) == 1 && object.spec.selectors[0].matches('^unix:user:sb-[0-9a-f]{12}$'))
      message: "a claim entry must select exactly one unix:user:sb-<12 hex> (ADR-0004)"
      reason: Forbidden
    - expression: "!has(object.spec.admin) || !object.spec.admin"
      message: "mediatore entries are never admin"
      reason: Forbidden
    - expression: "!has(object.spec.downstream) || !object.spec.downstream"
      message: "mediatore entries are never downstream"
      reason: Forbidden
    - expression: "!has(object.spec.storeSVID) || !object.spec.storeSVID"
      message: "mediatore entries never use an SVIDStore"
      reason: Forbidden
    - expression: "!has(object.spec.federatesWith) || size(object.spec.federatesWith) == 0"
      message: "mediatore entries never federate"
      reason: Forbidden
    - expression: "!has(object.spec.dnsNames) || size(object.spec.dnsNames) == 0"
      message: "mediatore entries carry no DNS names"
      reason: Forbidden
    - expression: "has(object.spec.className) && object.spec.className != ''"
      message: "className is required (the controller manager ignores classless resources)"
      reason: Invalid
    - expression: "!has(object.spec.x509SVIDTTL) || duration(object.spec.x509SVIDTTL) <= duration('4h')"
      message: "x509SVIDTTL must be at most 4h"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mediatore-clusterstaticentry
  labels:
    app.kubernetes.io/name: mediatore
    app.kubernetes.io/component: admission
spec:
  policyName: mediatore-clusterstaticentry
  validationActions: ["Deny"]
  paramRef:
    name: mediatore-agentsandbox-subject-policy
    namespace: mediatore-system
    parameterNotFoundAction: Deny
