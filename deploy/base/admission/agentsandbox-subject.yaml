#
# AgentSandbox subject authorization (ADR-0008 decision 5).
#
# `spec.subject` records WHO a sandbox is for. Everything downstream derives
# from it: the VirtualMachineClaim's subject, the sb- user in the guest, and
# every token mediatore mints. Without this policy anyone holding
# `create agentsandboxes` could attribute a sandbox, and the tokens it mints,
# to anyone else, and the audit log would record it as genuine.
#
# Checked at ADMISSION, while the requesting principal still exists; the
# reconciler only ever sees an object. The shape is banlieue's claim-subject
# policy (banlieue ADR-0047 decision 10), restated for this resource:
#
#   subject.id     == the authenticated username, once this cluster's
#                     username prefix is applied. The API server vouches for
#                     the username, so this is a real binding. The field holds
#                     the RAW subject as the issuer spells it, because that is
#                     what a token carries and what the guest compares against.
#   subject.issuer  the API server cannot tell which issuer minted the
#                     caller's token. With `issuerPrefixes` empty the issuer is
#                     not checked here (one issuer, ADR-0008). Once it lists
#                     anything, an issuer it does not list is refused, and the
#                     id is checked under the listed issuer's own prefix
#                     (ADR-0072 decision 1); a list that cannot tell its issuers
#                     apart admits nothing (decision 2). mediatore refuses, at
#                     reconcile and before any claim exists, an issuer it is
#                     not configured with, and, for a sandbox it did not create
#                     itself, an issuer outside `sandboxes.declarative_issuers`
#                     (crates/mediatore-claims/src/sandbox.rs).
#
# The annotation `mediatore.io/front-door: api` marks a sandbox the broker
# created through POST /v1/claims (ADR-0072 decision 3). On CREATE it is
# admitted only from the broker's username and only with the value `api`; on
# UPDATE nobody may add, change or remove it. The `brokers` list does not lift
# this. The broker proves at start that this rule is in force before it relies
# on the mark (decision 5).
#
# Two exemptions from the id check, both deliberate trust concentrations:
#
#   mediatore's own ServiceAccount, which creates sandboxes for the subjects it
#   has validated bearer tokens for (POST /v1/claims, decision 4). Its token
#   validation is the control there.
#
#   an explicit list of brokers, EMPTY by default. Add a principal only when
#   something really does hand sandboxes to other people, and audit changes
#   to the ConfigMap: a listed broker can attribute a sandbox to anyone.
#
# The whole spec is immutable after creation: subject because the attribution
# was authorized then, the rest because the reconciler reads it once, when it
# creates the claim, so an edit would appear to work and change nothing.
#
# Requires Kubernetes 1.30+ (ValidatingAdmissionPolicy GA) and CEL variables.
# The ConfigMap comes first: the binding sets parameterNotFoundAction: Deny,
# so it must exist or every AgentSandbox is rejected.
#
# The ConfigMap is also where the four policies that name the broker read its
# username (ADR-0056 decision 4, ADR-0075): this one, agentsandbox-status.yaml,
# clusterstaticentry-mediatore.yaml and clusterspiffeid.yaml are each bound to
# it, with parameterNotFoundAction: Deny, and each reads the key `broker`. One
# value, in place of a literal in four files. Without the ConfigMap, or without
# the key, the first three refuse: no AgentSandbox, no status write and no
# ClusterStaticEntry (the gateway's included) is admitted until it is back.
# Without the ConfigMap no ClusterSPIFFEID in the cluster is created or changed
# either; without the key, none that renders /mediatore.
#
# AN OVERLAY THAT RENAMES THE ServiceAccount OR MOVES THE BROKER TO ANOTHER
# NAMESPACE patches what a kustomize `namespace:` does not rewrite:
#
#   1. the value of `broker` below (a string, not object metadata);
#   2. `paramRef.namespace` in the four bindings (this file, the status policy,
#      the entries policy and the ClusterSPIFFEID policy), which must be the
#      namespace this ConfigMap is in;
#   3. `namespaceSelector` in clusterspiffeid.yaml.
#
# Forgetting 1 or 2 fails closed and loudly: the broker's entries and status
# writes are refused, and the broker says so when it starts (its self-check,
# crates/mediatore-spire/src/kube.rs) instead of serving. Forgetting 3 leaves
# the broker without an SVID, which also stops it at start; with 1 patched, the
# ClusterSPIFFEID policy refuses the unpatched object, so the apply says so first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediatore-agentsandbox-subject-policy
  namespace: mediatore-system
  labels:
    app.kubernetes.io/name: mediatore
    app.kubernetes.io/component: admission
data:
  # The prefix this cluster's API server prepends to authenticated usernames
  # (`--oidc-username-prefix`, or `claimMappings.username.prefix` in an
  # AuthenticationConfiguration). Empty for certificate or ServiceAccount
  # auth. The policy adds it when checking; the resource stores the raw id.
  usernamePrefix: |

  # Per-issuer prefixes, for an API server that trusts more than one issuer:
  # one `<issuer> <prefix>` pair per line, each exactly as the
  # AuthenticationConfiguration spells it. Empty by default, and then every
  # sandbox is checked against `usernamePrefix`, whatever issuer it names.
  # Once any non-blank line is here (ADR-0072):
  #   - a sandbox naming an issuer listed here is checked against that
  #     issuer's prefix, and one naming an issuer NOT listed is refused: there
  #     is no fallback to `usernamePrefix`;
  #   - every non-blank line must be exactly `<issuer> <prefix>`, no issuer may
  #     appear twice, and no prefix may equal another or be the start of
  #     another. A list that breaks any of these admits no AgentSandbox from
  #     anybody the id check applies to, until it is corrected.
  #
  #   issuerPrefixes: |
  #     https://dex.example.com github:
  #     https://login.microsoftonline.com/<tenant>/v2.0 entra:
  issuerPrefixes: |

  # Principals allowed to set an arbitrary `spec.subject.id`, one username per
  # line, as the API server spells it (a ServiceAccount is
  # `system:serviceaccount:<namespace>:<name>`). mediatore's own ServiceAccount
  # is exempt without being listed. Deliberately empty.
  brokers: |

  # The broker's own username, exactly as the API server spells it:
  # `system:serviceaccount:<namespace>:<ServiceAccount>`. Read by this policy (the
  # exemption for the broker's own creates), by agentsandbox-status.yaml (the one
  # writer of a status) and by clusterstaticentry-mediatore.yaml (the one sender
  # of the broker's SPIRE entries). Whoever can edit this value can name another
  # account as the broker: audit changes to this ConfigMap, and keep `update` on
  # ConfigMaps in this namespace to whoever deploys the broker.
  broker: system:serviceaccount:mediatore-system:mediatore
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mediatore-agentsandbox-subject
  labels:
    app.kubernetes.io/name: mediatore
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  # Every served version, by name (ADR-0049 decision 3): a served version left out would
  # be ungoverned. Kept equal to the CRD's served versions by a unit test in
  # crates/mediatore-claims/src/sandbox.rs; never `*`.
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["mediatore.io"]
        apiVersions: ["v1alpha1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agentsandboxes"]
  variables:
    - name: isMediatore
      expression: "request.userInfo.username == params.data.broker.trim()"
    # Split on newlines and drop blanks, so a trailing newline or an empty
    # list never yields a phantom "" entry.
    - name: brokers
      expression: >-
        params.data.?brokers.orValue('').split('\n')
          .filter(l, l.trim() != '').map(l, l.trim())
    - name: isBroker
      expression: "request.userInfo.username in variables.brokers"
    # Trailing newline stripped; an empty prefix is a valid value.
    - name: usernamePrefix
      expression: "params.data.?usernamePrefix.orValue('').trim()"
    # ADR-0072 decision 1: every non-blank line counts, whether or not it
    # parses, so a list of typos is not read as an empty list.
    - name: issuerLines
      expression: >-
        params.data.?issuerPrefixes.orValue('').split('\n')
          .filter(l, l.trim() != '')
    # Each line as its words. A line that is not exactly two words is kept,
    # so that issuerPrefixesAreSound can refuse it; nothing is dropped.
    - name: issuerPrefixes
      expression: >-
        variables.issuerLines.map(l, l.trim().split(' ').filter(w, w != ''))
    # ADR-0072 decision 2: every line a pair, no issuer twice, and no prefix
    # equal to another or the start of another (a prefix starts with itself,
    # so each must be the start of exactly one). With it, a username names one
    # listed issuer at most.
    - name: issuerPrefixesAreSound
      expression: >-
        variables.issuerPrefixes.all(e, size(e) == 2)
        && variables.issuerPrefixes.all(a,
             size(variables.issuerPrefixes.filter(b, b[0] == a[0])) == 1)
        && variables.issuerPrefixes.all(a,
             size(variables.issuerPrefixes.filter(b, b[1].startsWith(a[1]))) == 1)
    # The issuer the sandbox names is one this cluster's users can come from:
    # any, while nothing is listed; otherwise only a listed one. No fallback.
    - name: issuerListed
      expression: >-
        size(variables.issuerLines) == 0
        || variables.issuerPrefixes.exists(e,
             size(e) == 2 && e[0] == object.spec.subject.issuer)
    - name: expectedPrefix
      expression: >-
        size(variables.issuerLines) == 0
          ? variables.usernamePrefix
          : variables.issuerPrefixes.filter(e,
              size(e) == 2 && e[0] == object.spec.subject.issuer)[0][1]
    # ADR-0072 decision 3: the broker's mark on a sandbox it created through
    # POST /v1/claims. Kept equal to FRONT_DOOR_ANNOTATION in
    # crates/mediatore-claims/src/sandbox.rs by a unit test.
    - name: frontDoor
      expression: "object.metadata.?annotations[?'mediatore.io/front-door']"
  validations:
    # 1. The binding the API server can vouch for. CREATE only: on UPDATE the
    #    requester is mediatore's reconciler writing its finalizer, and
    #    validation 2 makes the spec immutable anyway. Once issuerPrefixes
    #    lists anything, the issuer must be listed and the list sound
    #    (ADR-0072 decisions 1 and 2); the expectedPrefix comparison is only
    #    reached when both hold, so it never reads a pair that is not there.
    - expression: >-
        request.operation != 'CREATE'
        || variables.isMediatore
        || variables.isBroker
        || (variables.issuerPrefixesAreSound
            && variables.issuerListed
            && variables.expectedPrefix + object.spec.subject.id
                 == request.userInfo.username)
      messageExpression: >-
        !variables.issuerPrefixesAreSound
        ? 'issuerPrefixes of ConfigMap mediatore-agentsandbox-subject-policy'
          + ' cannot tell its issuers apart: every non-blank line must be'
          + ' exactly <issuer> <prefix>, no issuer may be listed twice, and no'
          + ' prefix may equal another or be the start of another. No'
          + ' AgentSandbox is admitted until it is corrected (ADR-0072).'
        : !variables.issuerListed
        ? 'spec.subject.issuer ' + object.spec.subject.issuer
          + ' is not listed in issuerPrefixes of ConfigMap'
          + ' mediatore-agentsandbox-subject-policy: this cluster\'s users'
          + ' come from the issuers listed there and no other'
        : 'spec.subject.id is ' + object.spec.subject.id
        + ' (which this cluster would spell '
        + variables.expectedPrefix + object.spec.subject.id
        + ') but you are authenticated as ' + request.userInfo.username
        + '. An AgentSandbox records who a sandbox is for, so it may only name'
        + ' its own creator. Requesting one for somebody else is a broker'
        + " privilege: add the broker's username to the 'brokers' list in"
        + ' ConfigMap mediatore-agentsandbox-subject-policy, or go through'
        + ' mediatore (POST /v1/claims).'
      reason: Forbidden

    # 2. Immutability of the whole spec. Without it, check 1 is bypassed by
    #    creating a sandbox for oneself and patching the subject afterwards;
    #    the other fields are read once, at claim creation.
    - expression: >-
        request.operation != 'UPDATE'
        || object.spec == oldObject.spec
      messageExpression: >-
        'spec is immutable: it records a request that was authorized when the'
        + ' AgentSandbox was created and that mediatore acted on then. Delete'
        + ' it and make a new one (which releases the VM, by design).'
      reason: Forbidden

    # 3. The broker's mark, on CREATE (ADR-0072 decision 3): admitted only from
    #    the broker's own username and only with the value `api`. This binds
    #    the broker too, and the `brokers` list does not lift it.
    - expression: >-
        request.operation != 'CREATE'
        || !variables.frontDoor.hasValue()
        || (variables.isMediatore && variables.frontDoor.value() == 'api')
      messageExpression: >-
        'the annotation mediatore.io/front-door is the broker\'s own: it marks'
        + ' a sandbox the broker created through POST /v1/claims, only the'
        + ' broker may set it, and only to api (ADR-0072)'
      reason: Forbidden

    # 4. The mark is immutable (ADR-0072 decision 3): on UPDATE it can be
    #    neither added, changed nor removed, by anybody.
    - expression: >-
        request.operation != 'UPDATE'
        || (variables.frontDoor.hasValue()
              == oldObject.metadata.?annotations[?'mediatore.io/front-door'].hasValue()
            && variables.frontDoor.orValue('')
              == oldObject.metadata.?annotations[?'mediatore.io/front-door'].orValue(''))
      messageExpression: >-
        'the annotation mediatore.io/front-door is immutable: it records how'
        + ' the sandbox was created, and cannot be added, changed or removed'
        + ' (ADR-0072)'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mediatore-agentsandbox-subject
  labels:
    app.kubernetes.io/name: mediatore
    app.kubernetes.io/component: admission
spec:
  policyName: mediatore-agentsandbox-subject
  validationActions: ["Deny"]
  paramRef:
    name: mediatore-agentsandbox-subject-policy
    namespace: mediatore-system
    # Fail closed: no policy object, no sandboxes.
    parameterNotFoundAction: Deny
