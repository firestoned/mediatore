# User-facing endpoint only. The sandbox listener is reached by VMs directly (mTLS), never via ingress.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediatore
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`mediatore.sandbox.example`)
      kind: Rule
      services:
        - { name: mediatore, port: user }
  tls: {}
