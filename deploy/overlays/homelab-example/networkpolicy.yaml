#
# ADR-0007 decision 7: what may reach the broker pods and what they may reach. Ingress to
# the sandbox listener from the sandbox segment only, to the user API from the ingress
# proxies only; egress to DNS, the API server and the issuer, nothing else. The Workload
# API is a socket on the node, not a network path. The CIDRs are placeholders (RFC 5737):
# put the sandbox segment and the control-plane addresses of your cluster in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mediatore
  labels: { app.kubernetes.io/name: mediatore }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mediatore }
  policyTypes: [Ingress, Egress]
  ingress:
    # The sandbox listener: pool VMs on the sandbox segment (the guest and the jailed
    # workload), over SPIFFE mTLS.
    - from:
        - ipBlock: { cidr: 192.0.2.0/24 }
      ports:
        - { port: 8443, protocol: TCP }
    # The user API: the Tailscale operator's proxy pods, which the Ingress routes to.
    # Add your ingress controller's namespace if it is another one.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: tailscale }
      ports:
        - { port: 8080, protocol: TCP }
    # The kubelet's readiness probe, for a CNI that does not exempt it: the node CIDR.
    - from:
        - ipBlock: { cidr: 198.51.100.0/24 }
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # The API server (AgentSandbox, claims, ClusterStaticEntry, the Lease): the
    # control-plane addresses.
    - to:
        - ipBlock: { cidr: 198.51.100.0/24 }
      ports:
        - { port: 6443, protocol: TCP }
    # The issuer, when it runs in the cluster (Dex in namespace `dex`): discovery, JWKS
    # and the refresh grant before every issue. For an issuer on the internet (Google,
    # Auth0, Entra) or an OpenBao elsewhere, add an ipBlock for 443 (and 8200) to its
    # addresses instead; the broker never needs the internet otherwise.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: dex }
      ports:
        - { port: 5556, protocol: TCP }
        - { port: 443, protocol: TCP }
