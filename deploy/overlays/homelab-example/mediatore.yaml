#
# The broker's config for the homelab overlay. Placeholders throughout: your trust
# domain, your issuer (docs/guides/issuers.md has Dex with GitHub, Google, Auth0 and
# Entra), your audiences. The store is the Kubernetes API (ADR-0034): nothing to point at.
trust_domain: sandbox.home.example
listen:
  user: 0.0.0.0:8080
  sandbox: 0.0.0.0:8443
spire:
  workload_api_socket: unix:///run/spire/sockets/spire-agent.sock
  entries:
    # The SPIRE Controller Manager's class (the chart's release name plus `-spire`).
    class_name: spire-server-spire
    # The claim SVID's TTL: 15m by default and at most (ADR-0027 decision 7), never more
    # than the claim has left; a sandbox that loses its gateways keeps its identity for
    # this long at most.
    # claim_svid_ttl: 15m
issuers:
  - url: https://dex.home.example
    backend: sts
    client_id: mediatore
    subject_claim: preferred_username
    required_group: firestoned:sandbox-users
    session: { client_id: mediatore }
audiences:
  # egress: where the jail may reach this audience's API (host:port); without it the
  # workload gets tokens it can spend nowhere (ADR-0020). An endpoint belongs to one
  # audience. rules (optional): what the egress proxy forwards for it, nono's
  # endpoint_rules shape, `*` one path segment, `**` any; none means every method and
  # path (ADR-0025). ca_file (optional): the CA the proxy trusts for this audience's
  # endpoints instead of the Mozilla roots, for a service on your private PKI; a PEM from
  # a Secret mounted like the STS key.
  - name: grafana.home.example
    via: sts
    max_ttl: 900
    egress: ["grafana.home.example:443"]
    rules:
      - { method: GET, path: "/api/**" }
      - { method: POST, path: "/api/ds/query" }
    # ca_file: /etc/mediatore-cas/home.pem
# The environment's egress gateways (ADR-0028 decision 6): the three gateways' sandbox
# addresses and data-plane port, addresses not names, in the order every guest receives
# them on GET /v1/me. With it the egress proxy tunnels every upstream through one of them as
# the claim and the sandbox ruleset admits the gateways and the control relay alone, no
# DNS; without it the proxy dials the audiences' egress directly (deploying guide, step 7).
# gateways: ["198.51.100.1:8443", "198.51.100.2:8443", "198.51.100.3:8443"]
# Registries. Without gateways (ADR-0022): a private one gets its login and a token file
# from a Secret mounted like the STS key, and the guest gets that credential for the
# registry its claim's image names.
# registries:
#   - { host: registry.internal:5000, username: pool, password_file: /etc/mediatore-registry/token }
# With `gateways` set, `registries[]` is refused (ADR-0063): a registry is an audience of
# `role: registry` the claim names, pulled through its proxy and a gateway, e.g.
#   - { name: mirror, via: none, role: registry, egress: ["registry.home.example:443"],
#       rules: [{ method: GET, path: "/v2/**" }, { method: HEAD, path: "/v2/**" }] }
sts:
  issuer: https://mediatore.home.example
  kid: homelab-1
  signing_key_file: /etc/mediatore-sts/sts.pem
sandboxes:
  # Where `POST /v1/claims` creates AgentSandbox resources; the pool must live there.
  namespace: sandboxes
# notaio's signed policy bundles, read and compared with each sandbox in shadow: nothing
# is refused on their account (ADR-0026). Leave the section out to read none. The key is
# notaio's OpenBao transit public key, `notaio:v<N>` and its base64; list two versions
# during a rotation. Never take it from the cluster.
# policy:
#   trusted_keys:
#     - { id: "notaio:v1", public_key: "<base64 Ed25519 public key>" }
#   namespaces: [sandboxes]   # default: sandboxes.namespace
# A workload's output, redacted in the VM and streamed to its owner (ADR-0045). Off by
# default: a claim with `workload.logs: true` is refused and the routes answer 501. On, the
# broker keeps the newest `max_bytes` per claim (default 1 MiB, ceiling 4 MiB) in Secrets
# owned by the sandbox, for `retention_secs` after the claim ends (default: store.retention_secs).
logs:
  enabled: false
store:
  # No URL since ADR-0034: the AgentSandbox status (in sandboxes.namespace) and the
  # Secrets, SandboxNode and PolicyFloor resources in the broker's namespace are the store.
  sealing:
    key_file: /etc/mediatore-sealing/key
